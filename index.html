    favs:()=>`<h2 style="font-size:24px;margin-bottom:20px">My favorite tools</h2>${state.favorites.length?`<div class="tools-grid">${state.favorites.map(id=>byId[id]).filter(Boolean).map(toolCardHTML).join('')}</div>`:`<div class="empty">${ic('star')}<h3>No favorites yet</h3><p>Tap the star on any tool card to pin it here.</p></div>`}`,
    history:()=>`<h2 style="font-size:24px;margin-bottom:20px">Activity history</h2>${state.history.length?recentTableHTML(60):`<div class="empty">${ic('clock')}<h3>No activity yet</h3><p>Your conversions will appear here.</p></div>`}`,
    trash:()=>{ const items=state.trash; return `<h2 style="font-size:24px;margin-bottom:20px">Trash</h2>${items.length?recentTableHTML(60,true):`<div class="empty">${ic('trash')}<h3>Trash is empty</h3><p>Deleted files rest here for 30 days.</p></div>`}`; },
    settings:()=>`<h2 style="font-size:24px;margin-bottom:20px">Settings</h2>
      <div class="panel" style="max-width:520px">
        <h4>Appearance</h4>
        <label class="check-row"><input type="checkbox" id="setTheme" ${state.theme==='dark'?'checked':''}> Dark mode</label>
        <div class="divider"></div>
        <h4>Account</h4>
        ${state.user?`<p style="font-size:14px;margin-bottom:12px">Signed in as <b>${esc(state.user)}</b></p><button class="btn btn-ghost btn-sm" data-action="logout">Sign out</button>`
          :`<button class="btn btn-primary btn-sm" data-action="login">Log in</button> <button class="btn btn-ghost btn-sm" data-action="signup">Create account</button>`}
        <div class="divider"></div>
        <h4>Data</h4>
        <button class="btn btn-danger btn-sm" data-action="clear-data">${ic('trash')} Clear all local data</button>
        <p class="muted" style="font-size:12.5px;margin-top:10px">Removes history, favorites and preferences stored in this browser.</p>
      </div>`,
  };
  app.innerHTML=headerHTML()+`<div class="dash">
    <aside class="dside"><nav aria-label="Dashboard sections">
      ${tabs.map(t=>`<button class="${state.dashTab===t[0]?'on':''}" data-action="dash-tab" data-tab="${t[0]}">${ic(t[2])} ${t[1]}</button>`).join('')}
    </nav>
    <div class="storage"><b style="font-size:13px">Session workspace</b>
      <div class="pbar"><i style="width:${used/(1048576*100)*100}%"></i></div>
      <span class="muted" style="font-size:12px">${fmtSize(used)} of 100 MB</span></div>
    </aside>
    <main>${content[state.dashTab]||content.overview()}</main>
  </div>`;
  const st=$('#setTheme'); if(st)st.addEventListener('change',()=>setTheme(st.checked?'dark':'light'));
}
function recentTableHTML(limit, trash=false){
  const items=(trash?state.trash:state.history).slice(0,limit);
  if(!items.length)return `<div class="empty">${ic('folder')}<h3>Nothing here yet</h3><p>Files you create will show up in this list.</p></div>`;
  return `<div class="panel" style="padding:6px 4px"><div class="ftable-wrap"><table class="ftable">
    <thead><tr><th>File</th><th>Tool</th><th>Size</th><th>Created</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody>${items.map(r=>`<tr>
      <td class="fname" title="${esc(r.name)}">${typeIcon(getExt(r.name),catColor((byId[r.toolId]||{}).cat))} <span style="vertical-align:middle">${esc(r.name)}</span></td>
      <td class="muted">${esc(r.tool)}</td><td class="muted">${fmtSize(r.size)}</td><td class="muted">${timeAgo(r.date)}</td>
      <td style="text-align:right;white-space:nowrap">
        ${blobs.has(r.name)&&!trash?`<button class="icon-btn" data-action="dl" data-name="${esc(r.name)}" data-id="${r.id}" aria-label="Download">${ic('download')}</button>`:''}
        ${trash
          ?`<button class="icon-btn" data-action="restore" data-id="${r.id}" aria-label="Restore">${ic('refresh')}</button>`
          :`<button class="icon-btn" data-action="again-tool" data-id="${r.toolId}" aria-label="Convert again with ${esc(r.tool)}">${ic('refresh')}</button>
            <button class="icon-btn" data-action="trash-move" data-id="${r.id}" aria-label="Move to trash">${ic('trash')}</button>`}
      </td></tr>`).join('')}</tbody></table></div></div>`;
}

/* =================================================================
   AUTH / UPGRADE / SHARE MODALS
   ================================================================= */
function openAuth(mode){
  const isLogin=mode==='login';
  openModal({title:isLogin?'Welcome back':'Create your free account',body:`
    <form id="authForm" style="display:grid;gap:14px">
      ${isLogin?'':`<div class="field"><label for="auName">Full name</label><input id="auName" type="text" required placeholder="Alex Rivera"></div>`}
      <div class="field"><label for="auMail">Email</label><input id="auMail" type="email" required placeholder="you@company.com"></div>
      <div class="field"><label for="auPass">Password</label><input id="auPass" type="password" required minlength="6" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-lg" type="submit" style="width:100%">${isLogin?'Log in':'Create account'}</button>
      <p class="muted" style="font-size:12.5px;text-align:center">Demo build — credentials stay in your browser only.</p>
    </form>`});
  $('#authForm').addEventListener('submit',e=>{
    e.preventDefault();
    state.user=$('#auMail').value; LS.set('user',state.user);
    closeModal(); toast('success',isLogin?'Signed in.':'Account created.',`Signed in as ${state.user}`);
    rerender();
  });
}
function openUpgrade(toolName){
  openModal({title:`${toolName} is a Pro tool`,body:`
    <div class="ticon" style="--accent:var(--warn);width:52px;height:52px;margin:4px auto 14px">${ic('zap')}</div>
    <p style="text-align:center;margin-bottom:8px"><b>${esc(toolName)}</b> uses our encrypted server pipeline for heavy processing and is available on paid plans.</p>
    <p class="muted" style="font-size:13.5px;text-align:center;margin-bottom:16px">Everything else in the suite — merging, OCR, conversions, signing — stays free and local.</p>
    <ul style="list-style:none;display:grid;gap:8px;margin-bottom:6px">
      ${['Unlimited conversions','Batch processing up to 2 GB','OCR & table extraction','Priority processing'].map(f=>`<li style="display:flex;gap:10px;font-size:14px">${ic('check','fill')}<span style="color:var(--ok);display:flex">${ic('check','fill')}</span>${f}</li>`).join('')}
    </ul>`,
    footer:`<button class="btn btn-ghost" data-close>Maybe later</button><button class="btn btn-primary" data-action="go-pricing-modal">See plans</button>`});
}
function openPreview(id){
  const o=(ws&&ws.outputs||[]).find(x=>x.id===id)||null;
  if(!o)return;
  const isImg=/^image\//.test(o.blob.type);
  openModal({title:esc(o.name),wide:true,body:isImg
    ?`<img class="preview-img" src="${o.url}" alt="Preview of ${esc(o.name)}">`
    :`<div class="empty">${typeIcon(getExt(o.name),catColor(ws.tool.cat))}<h3>${esc(o.name)}</h3><p>${fmtSize(o.blob.size)} · preview available for image outputs</p></div>`,
    footer:`<button class="btn btn-primary" data-action="dl" data-id="${o.id}" data-name="${esc(o.name)}">${ic('download')} Download</button>`});
}
function openShortcuts(){
  openModal({title:'Keyboard shortcuts',body:`
    ${[['/','Focus tool search'],['Ctrl / ⌘ + O','Open file picker'],['Ctrl / ⌘ + S','Download current results'],['Ctrl / ⌘ + K','Toggle dark mode'],['Esc','Close dialog'],['?','This dialog']].map(k=>`<div class="klist"><span>${k[1]}</span><span class="kbd">${k[0]}</span></div>`).join('')}`});
}

/* =================================================================
   GLOBAL EVENTS (delegation)
   ================================================================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const a=el.dataset.action;
  const act={
    'go-home':()=>{e.preventDefault();go('home')},
    'go-tools':()=>{e.preventDefault();go('tools')},
    'go-pricing':()=>{e.preventDefault();go('pricing')},
    'go-dash':()=>{e.preventDefault();go('dash')},
    'go-cat':()=>{e.preventDefault();toolFilter={q:'',chip:el.dataset.cat==='ocr'?'ocr':el.dataset.cat==='image'?'image':el.dataset.cat==='utility'?'all':'office'};go('tools');},
    'go-pricing-modal':()=>{closeModal();go('pricing')},
    'theme':()=>{setTheme(state.theme==='dark'?'light':'dark');rerender();},
    'menu':()=>{$('#mobileMenu').classList.toggle('open')},
    'open-search':()=>{e.preventDefault();$('#mobileMenu').classList.remove('open');
      if(state.view==='tools'){$('#toolSearch').focus();}else{go('tools');setTimeout(()=>$('#toolSearch')?.focus(),50);}},
    'shortcuts':()=>openShortcuts(),
    'login':()=>{e.preventDefault();$('#mobileMenu').classList.remove('open');openAuth('login')},
    'signup':()=>{e.preventDefault();$('#mobileMenu').classList.remove('open');openAuth('signup')},
    'logout':()=>{e.preventDefault();state.user=null;LS.set('user',null);toast('info','Signed out');rerender();},
    'chip':()=>{toolFilter.chip=el.dataset.chip;renderToolsChipsAndGrid();},
    'fav':(ev)=>{e.stopPropagation();e.preventDefault();const id=el.dataset.id;
      const i=state.favorites.indexOf(id);
      if(i>=0){state.favorites.splice(i,1);toast('info','Removed from favorites');}
      else{state.favorites.push(id);toast('success','Added to favorites',byId[id].name);}
      LS.set('favs',state.favorites);
      el.classList.toggle('on'); el.setAttribute('aria-pressed',el.classList.contains('on'));
      if(state.view==='tools')renderToolGrid(); if(state.view==='dash'&&state.dashTab==='favs')rerender();},
    'open-tool':()=>{ if(e.target.closest('[data-action=fav]'))return; go('tool',el.dataset.id); },
    'ws-browse':()=>{},
    'ws-add':()=>{ const dz=$('#wsDrop'); if(!dz){ // re-create hidden input
        const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.style.display='none';
        inp.accept=ws.tool.ext.length?'.'+ws.tool.ext.join(',.'):'';
        inp.addEventListener('change',()=>{addFiles([...inp.files]);inp.value='';});
        document.body.appendChild(inp);inp.click();inp.remove(); return; }
      dz.querySelector('input')?.click(); },
    'f-remove':()=>{ const i=+el.dataset.idx; const f=ws.files[i]; if(f&&f.pages)ws.totalPages-=f.pages;
      ws.files.splice(i,1); if(!ws.files.length){ws.stage='upload';} renderWs(); },
    'mv':()=>{ const i=+el.dataset.idx,d=+el.dataset.dir,j=i+d;
      if(j<0||j>=ws.files.length)return; [ws.files[i],ws.files[j]]=[ws.files[j],ws.files[i]]; renderWs(); },
    'convert':()=>processTool(),
    'dl':()=>{ const o=ws&&ws.outputs?ws.outputs.find(x=>x.id===el.dataset.id):null;
      if(o)download(o.blob,el.dataset.name||o.name);
      else{ const r=state.history.find(x=>x.id===el.dataset.id); if(r&&blobs.has(r.name))download(blobs.get(r.name).blob,r.name);
        else toast('warning','Session expired','File buffers live only in this session — run the tool again.'); } },
    'dl-all':async()=>{ if(!ws.outputs.length)return;
      try{ await loadLib('jszip'); const z=new JSZip();
        ws.outputs.forEach(o=>z.file(o.name,o.blob));
        const b=await z.generateAsync({type:'blob'});
        download(b,'docuflow-results.zip'); toast('success','ZIP downloaded'); }
      catch(err){ toast('error','ZIP failed','Could not build the archive.'); } },
    'share':async()=>{ if(navigator.share){ try{ await navigator.share({title:'DocuFlow',text:'I just converted files with DocuFlow — locally, in the browser.'}); }catch(_){} }
      else toast('info','Sharing','Use “Copy link” to share your results page.'); },
    'copy-link':()=>{ const link=location.origin+location.pathname+'#r/'+uid();
      navigator.clipboard?.writeText(link).then(()=>toast('success','Link copied','Share it to send someone to DocuFlow.'))
      .catch(()=>toast('warning','Copy failed','Clipboard unavailable in this context.')); },
    'preview':()=>openPreview(el.dataset.id),
    'again':()=>{ ws.outputs.forEach(o=>URL.revokeObjectURL(o.url)); ws.stage='config'; ws.outputs=[]; renderWs(); },
    'new-task':()=>{ go('tool',ws.tool.id); },
    'plan':()=>{ const p=el.dataset.plan;
      if(p==='Free')go('tools');
      else toast('info',`${p} plan`,'This demo build has no billing backend — imagine a beautiful checkout here.'); },
    'dash-tab':()=>{ state.dashTab=el.dataset.tab; viewDash(); },
    'clear-data':()=>{ ['favs','recentTools','history','trash','user','theme','billYearly'].forEach(k=>localStorage.removeItem('df_'+k));
      toast('success','Local data cleared'); setTimeout(()=>location.reload(),600); },
    'trash-move':()=>{ const i=state.history.findIndex(x=>x.id===el.dataset.id);
      if(i>=0){ state.trash.unshift(state.history[i]); state.history.splice(i,1);
        LS.set('history',state.history); LS.set('trash',state.trash); viewDash(); toast('info','Moved to trash'); } },
    'restore':()=>{ const i=state.trash.findIndex(x=>x.id===el.dataset.id);
      if(i>=0){ state.history.unshift(state.trash[i]); state.trash.splice(i,1);
        LS.set('history',state.history); LS.set('trash',state.trash); viewDash(); toast('success','Restored'); } },
    'again-tool':()=>{ go('tool',el.dataset.id); },
    'hero-upload':()=>{ $('#heroDrop')?.querySelector('input')?.click(); },
    'sig-clear':()=>{ window._sigClear&&window._sigClear(); },
  }[a];
  act&&act(el,e);
});
/* keyboard: activate tool cards with Enter */
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList?.contains('tcard')){ e.target.click(); }
  if(e.key==='Enter'&&e.target.getAttribute?.('role')==='button'&&e.target.dataset?.action==='preview'){ e.target.click(); }
  if(e.key==='Escape'){ closeModal(); $('#mobileMenu')?.classList.remove('open'); }
  if(e.key==='?'&&!/input|textarea|select/i.test(e.target.tagName)){ e.preventDefault(); openShortcuts(); }
  if(e.key==='/'&&!/input|textarea|select/i.test(e.target.tagName)){ e.preventDefault();
    if(state.view==='tools')$('#toolSearch')?.focus(); else go('tools'); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); setTheme(state.theme==='dark'?'light':'dark'); rerender(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault();
    if(ws&&ws.outputs&&ws.outputs.length){ const o=ws.outputs[0]; download(o.blob,o.name); toast('success','Saved',o.name); } }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){ e.preventDefault(); document.querySelector('.dropzone input[type=file]')?.click(); }
});

/* ---------- Smart drop (anywhere) ---------- */
let dragDepth=0;
window.addEventListener('dragenter',e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){ dragDepth++; $('#dropOverlay').classList.add('on'); } });
window.addEventListener('dragleave',()=>{ dragDepth=Math.max(0,dragDepth-1); if(!dragDepth)$('#dropOverlay').classList.remove('on'); });
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{
  e.preventDefault(); dragDepth=0; $('#dropOverlay').classList.remove('on');
  const fs=[...(e.dataTransfer?.files||[])]; if(!fs.length)return;
  const f=fs[0]; const ext=getExt(f.name);
  $('#dropOvIcon').innerHTML=typeIcon(ext||'file','#635BFF');
  $('#dropOvText').textContent=fs.length>1?`${fs.length} files ready`:`${f.name} · ${fmtSize(f.size)}`;
  // suggest tools
  const matches=TOOLS.filter(t=>t.ext.includes(ext)&&!t.pro).slice(0,6);
  const generic=TOOLS.filter(t=>['image-to-pdf','pdf-to-text','compress-pdf'].includes(t.id));
  const list=(matches.length?matches:generic).slice(0,6);
  setTimeout(()=>{
    openModal({title:matches.length?'We found tools for this file':'What would you like to do?',wide:true,
      body:`<p class="muted" style="font-size:13.5px;margin-bottom:14px">${esc(f.name)} · ${fmtSize(f.size)} · .${esc(ext||'?')}</p>
      <div class="tools-grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">
      ${list.map(t=>`<div class="tcard" style="padding:14px;--accent:${catColor(t.cat)}" data-action="smart-tool" data-id="${t.id}" tabindex="0" role="button">
        <div class="tcard-top"><div class="ticon" style="width:36px;height:36px">${typeIcon(t.cat==='image'?'IMG':'PDF',catColor(t.cat))}</div></div>
        <h3 style="font-size:13.5px">${esc(t.name)}</h3><span class="go" style="font-size:12px">Use tool ${ic('arrowR')}</span></div>`).join('')}
      </div>`});
  },150);
  window._smartFiles=fs;
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action=smart-tool]'); if(!el)return;
  closeModal(); go('tool',el.dataset.id,window._smartFiles||[]);
});

/* ---------- Router ---------- */
function renderToolsChipsAndGrid(){ renderToolGrid(); $$('.chip[data-chip]').forEach(c=>c.classList.toggle('on',c.dataset.chip===toolFilter.chip)); }
function go(view, param, presetFiles){
  closeModal(); $('#mobileMenu')?.classList.remove('open');
  state.view=view; state.toolId=param;
  window.scrollTo({top:0});
  if(view==='home')viewHome();
  else if(view==='tools')viewTools();
  else if(view==='pricing')viewPricing();
  else if(view==='dash')viewDash();
  else if(view==='tool')viewTool(param,presetFiles);
  rerenderThemeIcon();
}
function rerender(){ 
  if(state.view==='home')viewHome();
  else if(state.view==='tools')viewTools();
  else if(state.view==='pricing')viewPricing();
  else if(state.view==='dash')viewDash();
}
function rerenderThemeIcon(){ const b=$('[data-action=theme]'); if(b)b.innerHTML=ic(state.theme==='dark'?'sun':'moon'); }

/* close mobile menu on nav click */
document.addEventListener('click',e=>{ if(e.target.closest('#mobileMenu a,#mobileMenu .mlink'))$('#mobileMenu').classList.remove('open'); });

/* ---------- Boot ---------- */
go('home');
toast('info','Welcome to DocuFlow','Press / to search tools, or drop any file anywhere on the page.');
</script>
</body>
</html>
