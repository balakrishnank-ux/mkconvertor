<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuFlow — PDF & Document Toolkit</title>
<meta name="description" content="Every document tool you need. In one place. Convert, merge, compress, edit and manage PDFs and documents — privately, in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --primary:#635BFF; --primary-h:#534AE0; --primary-soft:rgba(99,91,255,.1);
  --sky:#0EA5E9; --violet:#8B5CF6; --ok:#22C55E; --warn:#F59E0B; --err:#EF4444;
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --elev:#FFFFFF;
  --border:#E2E8F0; --border-h:#CBD5E1;
  --text:#0F172A; --text-2:#475569; --text-3:#64748B;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 2px 6px rgba(15,23,42,.05),0 12px 32px -12px rgba(15,23,42,.12);
  --shadow-lg:0 4px 12px rgba(15,23,42,.06),0 24px 64px -16px rgba(15,23,42,.2);
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
  --sp:8px; --font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --t:180ms cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --primary:#7C74FF; --primary-h:#8E87FF; --primary-soft:rgba(124,116,255,.14);
  --bg:#0B0F1E; --surface:#111731; --surface-2:#1A2140; --elev:#161D3B;
  --border:#252E52; --border-h:#38426E;
  --text:#EAEEF9; --text-2:#A6AFCC; --text-3:#7C86A8;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 2px 6px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.5);
  --shadow-lg:0 4px 12px rgba(0,0,0,.35),0 24px 64px -16px rgba(0,0,0,.6);
}
/* ============ RESET & BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background var(--t),color var(--t)}
img,svg{display:block}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
::selection{background:var(--primary-soft)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.02em;font-weight:700}
.muted{color:var(--text-3)}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
@media(max-width:640px){.container{padding:0 16px}}
/* ============ ICONS ============ */
.ic{width:1.25em;height:1.25em;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill svg{fill:currentColor;stroke:none}
/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;border-radius:var(--r);padding:10px 18px;border:1px solid transparent;transition:all var(--t);white-space:nowrap;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(99,91,255,.4)}
.btn-primary:hover{background:var(--primary-h);box-shadow:0 4px 14px rgba(99,91,255,.35);transform:translateY(-1px)}
.btn-ghost{border-color:var(--border);background:var(--surface);color:var(--text)}
.btn-ghost:hover{border-color:var(--border-h);background:var(--surface-2)}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-soft:hover{background:var(--primary);color:#fff}
.btn-danger{background:rgba(239,68,68,.1);color:var(--err)}
.btn-danger:hover{background:var(--err);color:#fff}
.btn-lg{padding:14px 26px;font-size:15px;border-radius:14px}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn-icon{width:38px;height:38px;padding:0;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;color:var(--text-3);transition:all var(--t)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
/* ============ HEADER ============ */
.hdr{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.hdr-in{display:flex;align-items:center;gap:20px;height:66px;max-width:1280px;margin:0 auto;padding:0 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.03em;flex:none}
.logo b{color:var(--primary)}
.nav{display:flex;gap:2px;margin-left:8px}
.nav a,.nav button{padding:8px 13px;border-radius:9px;font-size:14px;font-weight:500;color:var(--text-2);transition:all var(--t)}
.nav a:hover,.nav button:hover{color:var(--text);background:var(--surface-2)}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-trigger{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:8px 12px;color:var(--text-3);font-size:13px;min-width:190px;transition:all var(--t)}
.search-trigger:hover{border-color:var(--primary)}
.search-trigger kbd{margin-left:auto;font-family:var(--font);font-size:11px;border:1px solid var(--border);border-radius:6px;padding:1px 6px;background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
#mobileMenu{display:none}
@media(max-width:960px){
  .nav,.search-trigger,#hdrAuth{display:none}
  #hambBtn{display:inline-flex}
}
#hambBtn{display:none}
#mobileMenu.open{display:block;position:fixed;inset:66px 0 0;background:var(--bg);z-index:55;padding:20px;overflow:auto}
#mobileMenu a,#mobileMenu button.mlink{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:12px;font-size:16px;font-weight:500;color:var(--text);text-align:left}
#mobileMenu a:hover,#mobileMenu button.mlink:hover{background:var(--surface-2)}
#mobileMenu .msep{height:1px;background:var(--border);margin:12px 0}
/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;padding:76px 0 64px}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px 340px at 18% 0%,rgba(99,91,255,.09),transparent 65%),
             radial-gradient(560px 320px at 85% 8%,rgba(14,165,233,.08),transparent 65%)}
[data-theme="dark"] .hero::before{background:radial-gradient(600px 340px at 18% 0%,rgba(124,116,255,.13),transparent 65%),radial-gradient(560px 320px at 85% 8%,rgba(14,165,233,.1),transparent 65%)}
.hero-in{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;max-width:1200px;margin:0 auto;padding:0 24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);padding:6px 14px;border-radius:99px;margin-bottom:22px}
.hero h1{font-size:clamp(34px,4.6vw,54px);letter-spacing:-.035em;margin-bottom:18px}
.hero h1 em{font-style:normal;color:var(--primary);position:relative;white-space:nowrap}
.hero p.lead{font-size:17px;color:var(--text-2);max-width:520px;margin-bottom:28px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.hero-meta{display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--text-3)}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta .ic{color:var(--ok)}
/* Upload card in hero */
.up-card{background:var(--elev);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:14px;position:relative}
.up-card-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 12px;font-size:13px;font-weight:600;color:var(--text-3)}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--border)}
.dropzone{position:relative;border:2px dashed var(--border-h);border-radius:var(--r-lg);padding:44px 24px;text-align:center;transition:all var(--t);cursor:pointer;background:var(--surface)}
.dropzone:hover,.dropzone.drag{border-color:var(--primary);background:var(--primary-soft)}
.dz-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center}
.dz-icon .ic{width:30px;height:30px}
.dropzone h3{font-size:17px;margin-bottom:6px}
.dropzone p{font-size:13px;color:var(--text-3);margin-bottom:16px}
.fmt-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.fmt{font-size:10.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--border);border-radius:6px;padding:3px 7px;color:var(--text-3);background:var(--surface-2)}
.up-privacy{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;font-size:12.5px;color:var(--text-3)}
.up-privacy .ic{color:var(--ok);width:1.05em;height:1.05em}
@media(max-width:900px){.hero-in{grid-template-columns:1fr;gap:36px;padding-top:8px}.hero{padding:52px 0 48px}}
/* floating pills */
.pill-flow{position:absolute;font-size:11.5px;font-weight:600;background:var(--elev);border:1px solid var(--border);border-radius:99px;padding:6px 12px;box-shadow:var(--shadow);color:var(--text-2);display:flex;gap:6px;align-items:center;animation:floaty 7s ease-in-out infinite;pointer-events:none}
.pill-flow .ic{width:1.05em;height:1.05em}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media(prefers-reduced-motion:reduce){.pill-flow{animation:none}}
/* ============ SECTIONS ============ */
.sec{padding:64px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:30px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(24px,3vw,32px)}
.sec-head p{color:var(--text-3);margin-top:6px;max-width:560px}
/* ============ TOOL CARDS ============ */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.tcard{position:relative;background:var(--elev);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:10px;transition:all var(--t);cursor:pointer;overflow:hidden}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent,var(--primary)) 40%,var(--border))}
.tcard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--primary));opacity:0;transition:opacity var(--t)}
.tcard:hover::after{opacity:1}
.tcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ticon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--accent,var(--primary));background:color-mix(in srgb,var(--accent,var(--primary)) 11%,transparent)}
.ticon .ic{width:22px;height:22px}
.fav-btn{color:var(--text-3);opacity:0;transition:all var(--t)}
.tcard:hover .fav-btn,.fav-btn.on{opacity:1}
.fav-btn.on{color:var(--warn)}
.fav-btn.on .ic svg{fill:currentColor}
.tcard h3{font-size:15px;font-weight:700}
.tcard .desc{font-size:13px;color:var(--text-3);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-3)}
.tcard-foot .go{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--accent,var(--primary));font-size:13px}
.tcard:hover .go .ic{transform:translateX(3px)}
.go .ic{transition:transform var(--t)}
.badge-pro{font-size:10px;font-weight:800;letter-spacing:.06em;background:linear-gradient(0deg,var(--warn),var(--warn));border-radius:5px;padding:2px 6px;color:#fff}
/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 15px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all var(--t)}
.chip:hover{border-color:var(--border-h)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
/* ============ SEARCH / ALL TOOLS ============ */
.tools-toolbar{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 14px;transition:border var(--t)}
.search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:14px}
.search-box .ic{color:var(--text-3)}
.empty{padding:60px 20px;text-align:center;color:var(--text-3)}
.empty .ic{width:44px;height:44px;margin:0 auto 14px;opacity:.5}
/* ============ WORKSPACE ============ */
.ws-head{display:flex;align-items:center;gap:14px;padding:22px 0;flex-wrap:wrap}
.ws-head .ticon{width:48px;height:48px}
.crumb{font-size:13px;color:var(--text-3);margin-bottom:2px;display:flex;gap:6px;align-items:center}
.crumb b{color:var(--text);font-size:20px;letter-spacing:-.02em}
.ws-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;padding-bottom:40px}
@media(max-width:900px){.ws-grid{grid-template-columns:1fr}}
.panel{background:var(--elev);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.panel h4{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-bottom:14px;font-weight:700}
.panel + .panel{margin-top:16px}
/* file cards */
.fcard{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:11px;background:var(--surface);margin-bottom:10px;transition:all var(--t);position:relative}
.fcard:hover{border-color:var(--border-h);box-shadow:var(--shadow-sm)}
.fthumb{width:44px;height:44px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff}
.fthumb .ic{width:20px;height:20px}
.fthumb img{width:100%;height:100%;object-fit:cover}
.fmeta{flex:1;min-width:0}
.fmeta .fname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta .fsub{font-size:11.5px;color:var(--text-3)}
.fprog{height:4px;background:var(--surface-2);border-radius:99px;margin-top:6px;overflow:hidden}
.fprog i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s;width:0}
.facts{display:flex;gap:2px;flex:none}
/* settings form */
.field{margin-bottom:16px}
.field label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text-2)}
.field label output{color:var(--primary);font-variant-numeric:tabular-nums}
.field select,.field input[type=text],.field input[type=number],.field textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px;transition:border var(--t);outline:none}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field input[type=range]{width:100%;accent-color:var(--primary)}
.field input[type=color]{width:46px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:2px;cursor:pointer}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:8px 4px;font-size:12.5px;font-weight:600;color:var(--text-3);background:var(--surface);transition:all var(--t)}
.seg button.on{background:var(--primary);color:#fff}
.check-row{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;cursor:pointer;padding:4px 0}
.check-row input{width:17px;height:17px;accent-color:var(--primary)}
.color-row{display:flex;align-items:center;gap:10px}
.color-row span{font-size:13px;color:var(--text-3)}
/* sticky mobile convert */
.convert-bar{margin-top:18px}
@media(max-width:900px){
  .convert-bar{position:sticky;bottom:0;z-index:30;padding:12px 0;background:linear-gradient(0deg,var(--bg) 70%,transparent)}
  .convert-bar .btn{width:100%;box-shadow:var(--shadow-lg)}
}
/* ============ PROCESSING OVERLAY ============ */
.proc-overlay{position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.proc-box{background:var(--elev);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);width:min(480px,100%);padding:34px}
.spinner-ring{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;border:4px solid var(--primary-soft);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.proc-box h3{text-align:center;font-size:19px;margin-bottom:6px}
.proc-file{text-align:center;font-size:13px;color:var(--text-3);margin-bottom:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:8px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .25s;width:0}
.pct{font-size:13px;font-weight:700;color:var(--primary);text-align:right;font-variant-numeric:tabular-nums;margin-bottom:20px}
.steps{list-style:none;margin-bottom:24px}
.steps li{display:flex;align-items:center;gap:11px;padding:7px 0;font-size:14px;color:var(--text-3);transition:color var(--t)}
.steps li .st{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-h);flex:none;display:flex;align-items:center;justify-content:center;transition:all var(--t)}
.steps li .st .ic{width:11px;height:11px;opacity:0;color:#fff}
.steps li.done{color:var(--text)}
.steps li.done .st{background:var(--ok);border-color:var(--ok)}
.steps li.done .st .ic{opacity:1}
.steps li.active{color:var(--text);font-weight:600}
.steps li.active .st{border-color:var(--primary);border-top-color:transparent;animation:spin .8s linear infinite}
.proc-foot{display:flex;justify-content:center}
/* ============ RESULTS ============ */
.results-hero{text-align:center;padding:34px 0 26px}
.check-burst{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;background:rgba(34,197,94,.12);display:flex;align-items:center;justify-content:center;color:var(--ok);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.check-burst .ic{width:34px;height:34px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.results-hero h2{font-size:clamp(24px,3vw,32px);margin-bottom:8px}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:24px 0}
.rcard{background:var(--elev);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;transition:all var(--t);animation:riseIn .4s backwards}
.rcard:hover{box-shadow:var(--shadow)}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.rprev{height:120px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.rprev img{width:100%;height:100%;object-fit:cover}
.rprev .ic{width:36px;height:36px;color:var(--text-3)}
.rname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsize{font-size:11.5px;color:var(--text-3)}
.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-bottom:50px}
/* ============ TOASTS ============ */
#toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:12px;align-items:flex-start;background:var(--elev);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-lg);animation:toastIn .3s cubic-bezier(.34,1.4,.64,1);font-size:14px}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast .ic{width:20px;height:20px;flex:none;margin-top:1px}
.toast.success .ic{color:var(--ok)}.toast.error .ic{color:var(--err)}.toast.warning .ic{color:var(--warn)}.toast.info .ic{color:var(--sky)}
.toast b{display:block;font-size:14px}.toast span{font-size:13px;color:var(--text-3)}
@media(max-width:640px){#toasts{left:16px;right:16px;bottom:16px}}
/* ============ MODALS ============ */
.modal-bg{position:fixed;inset:0;z-index:150;background:rgba(10,14,30,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--elev);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);width:min(480px,100%);max-height:min(84vh,760px);display:flex;flex-direction:column;animation:modalIn .25s cubic-bezier(.34,1.3,.64,1)}
.modal.wide{width:min(680px,100%)}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(12px)}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
.modal-hd h3{font-size:18px}
.modal-bd{padding:18px 22px;overflow:auto}
.modal-ft{display:flex;justify-content:flex-end;gap:10px;padding:0 22px 20px}
/* ============ PRICING ============ */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:1020px;margin:36px auto 0;align-items:stretch}
.plan{background:var(--elev);border:1px solid var(--border);border-radius:var(--r-xl);padding:30px;display:flex;flex-direction:column;position:relative;transition:all var(--t)}
.plan.hot{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary),var(--shadow-lg)}
.plan .ptag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:5px 14px;border-radius:99px}
.plan h3{font-size:18px;margin-bottom:6px}
.plan .pdesc{font-size:13px;color:var(--text-3);margin-bottom:18px;min-height:38px}
.price{display:flex;align-items:baseline;gap:6px;margin-bottom:20px}
.price b{font-size:40px;letter-spacing:-.04em}
.price span{color:var(--text-3);font-size:14px}
.plan ul{list-style:none;flex:1;margin-bottom:24px}
.plan li{display:flex;gap:10px;padding:6px 0;font-size:14px;align-items:flex-start}
.plan li .ic{color:var(--ok);width:1.1em;height:1.1em;margin-top:3px;flex:none}
.plan li.na{color:var(--text-3);opacity:.6}.plan li.na .ic{color:var(--text-3)}
.bill-toggle{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.bill-toggle .save{font-size:12px;font-weight:700;color:var(--ok);background:rgba(34,197,94,.12);padding:3px 10px;border-radius:99px}
.switch{width:48px;height:27px;border-radius:99px;background:var(--border-h);position:relative;transition:background var(--t);border:none;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform var(--t);box-shadow:var(--shadow-sm)}
.switch[aria-checked=true]{background:var(--primary)}
.switch[aria-checked=true]::after{transform:translateX(21px)}
/* ============ DASHBOARD ============ */
.dash{display:grid;grid-template-columns:230px 1fr;gap:28px;max-width:1280px;margin:0 auto;padding:28px 24px 60px}
.dside{position:sticky;top:90px;align-self:start}
.dside nav{display:flex;flex-direction:column;gap:3px}
.dside nav button{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:11px;font-size:14px;font-weight:500;color:var(--text-2);text-align:left;transition:all var(--t)}
.dside nav button:hover{background:var(--surface-2);color:var(--text)}
.dside nav button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.dside .storage{margin-top:22px;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--elev)}
.storage .pbar{margin:10px 0 6px}
@media(max-width:860px){
  .dash{grid-template-columns:1fr;padding:16px}
  .dside{position:static}
  .dside nav{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .dside nav button{white-space:nowrap}
  .dside .storage{display:none}
}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qact{border:1px solid var(--border);border-radius:14px;background:var(--elev);padding:16px;display:flex;flex-direction:column;gap:9px;text-align:left;transition:all var(--t)}
.qact:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.qact .ticon{width:38px;height:38px}
.qact b{font-size:13.5px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:22px 0}
.stat{background:var(--elev);border:1px solid var(--border);border-radius:14px;padding:18px}
.stat b{font-size:26px;letter-spacing:-.03em;display:block}
.stat span{font-size:12.5px;color:var(--text-3)}
/* file table */
.ftable{width:100%;border-collapse:collapse;font-size:13.5px}
.ftable th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:10px 12px;border-bottom:1px solid var(--border)}
.ftable td{padding:12px;border-bottom:1px solid var(--border)}
.ftable tr:hover td{background:var(--surface-2)}
.ftable .fname{font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:720px){.ftable-wrap{overflow-x:auto}.ftable{min-width:640px}}
/* ============ MERGE LIST ============ */
.mlist{list-style:none}
.mlist li{display:flex;align-items:center;gap:11px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface);margin-bottom:9px;cursor:grab;transition:all var(--t)}
.mlist li.dragging{opacity:.45;border-style:dashed}
.mlist li.over{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.mnum{width:26px;height:26px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.mlist .vbtns{display:flex;flex-direction:column;gap:1px}
.mlist .vbtns .icon-btn{width:26px;height:20px}
.mlist .vbtns .ic{width:14px;height:14px}
.merge-sum{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;font-weight:600;color:var(--text-2);font-size:15px}
.merge-sum b{color:var(--primary)}
/* ============ SIGNATURE ============ */
.sig-tabs{display:flex;gap:6px;margin-bottom:16px}
.sig-canvas-wrap{border:2px dashed var(--border-h);border-radius:14px;background:
  repeating-linear-gradient(45deg,transparent 0 12px,rgba(120,130,160,.05) 12px 24px);position:relative;overflow:hidden}
#sigCanvas{width:100%;height:170px;touch-action:none;cursor:crosshair;display:block}
.sig-typed{width:100%;height:170px;border:2px dashed var(--border-h);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Segoe Script','Brush Script MT',cursive;font-size:34px;color:var(--primary)}
/* ============ TEXT2IMG EDITOR ============ */
.t2i-grid{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.t2i-grid{grid-template-columns:1fr}}
#t2iCanvas{max-width:100%;border-radius:14px;box-shadow:var(--shadow-lg);background:#fff;margin:0 auto;display:block}
.t2i-stage{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;display:flex;align-items:center;justify-content:center;min-height:380px}
.preset-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.preset-row .chip{font-size:12px;padding:6px 11px}
textarea.t2i-text{width:100%;min-height:100px;resize:vertical;border:1px solid var(--border);border-radius:12px;padding:12px;font-size:14px;outline:none;background:var(--surface)}
textarea.t2i-text:focus{border-color:var(--primary)}
/* ============ SMART DROP OVERLAY ============ */
#dropOverlay{position:fixed;inset:0;z-index:180;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px)}
#dropOverlay.on{display:flex}
#dropOverlay .inner{border:3px dashed var(--primary);border-radius:24px;padding:60px 80px;text-align:center;background:var(--elev);box-shadow:var(--shadow-lg);animation:pop .3s}
#dropOverlay .inner h3{font-size:22px;margin:16px 0 6px}
/* ============ PREVIEW MODAL ============ */
.preview-img{max-width:100%;max-height:60vh;border-radius:12px;margin:0 auto;display:block}
/* ============ FOOTER ============ */
footer{border-top:1px solid var(--border);padding:44px 0 30px;margin-top:40px}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px;margin-bottom:34px}
.foot-grid h5{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:14px}
.foot-grid a{display:block;font-size:14px;color:var(--text-2);padding:4px 0}
.foot-grid a:hover{color:var(--primary)}
.foot-bottom{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-3);flex-wrap:wrap;gap:12px}
@media(max-width:760px){.foot-grid{grid-template-columns:1fr 1fr}}
/* misc */
.fade-in{animation:riseIn .35s backwards}
.divider{height:1px;background:var(--border);margin:18px 0}
.kbd{font-family:var(--font);font-size:11.5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--text-2)}
.klist{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.klist:last-child{border:none}
</style>
</head>

/* Fuzzy match: subsequence with score */
function fuzzy(q, text){
  q=q.toLowerCase(); text=text.toLowerCase();
  let ti=0, score=0, streak=0;
  for(const c of q){
    if(c===' ')continue;
    const idx=text.indexOf(c, ti);
    if(idx===-1) return -1;
    streak = idx===ti ? streak+1 : 0;
    score += 10 + streak*4 - Math.min(idx-ti, 8);
    ti = idx+1;
  }
  return score + (text.startsWith(q)?30:0) + (text.includes(q)?15:0);
}

/* ---------- Toasts ---------- */
function toast(type, title, msg=''){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML=`${ic(type==='success'?'checkC':type==='error'?'xC':type==='warning'?'warn':'info')}<div><b>${esc(title)}</b>${msg?`<span>${esc(msg)}</span>`:''}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),260); }, 3800);
}

/* ---------- Modals ---------- */
function openModal({title, body, footer='', wide=false, onClose}){
  closeModal();
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-hd"><h3>${title}</h3><button class="icon-btn" data-close aria-label="Close dialog">${ic('x')}</button></div>
    <div class="modal-bd">${body}</div>${footer?`<div class="modal-ft">${footer}</div>`:''}</div>`;
  $('#modalRoot').appendChild(bg);
  bg.addEventListener('click', e=>{ if(e.target===bg || e.target.closest('[data-close]')) closeModal(); });
  bg._onClose=onClose;
  const f=bg.querySelector('input,select,textarea,button:not([data-close])'); f&&f.focus();
  return bg;
}
function closeModal(){ const m=$('#modalBg'); if(m){ m._onClose&&m._onClose(); m.remove(); } }

function parsePages(str,total){
  if(!str||!str.trim()) return Array.from({length:total},(_,i)=>i);
  const out=new Set();
  str.split(',').forEach(p=>{
    const m=p.trim().match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){ for(let i=+m[1];i<=+m[2];i++) if(i>=1&&i<=total) out.add(i-1); }
    else if(/^\d+$/.test(p.trim())&&+p>=1&&+p<=total) out.add(+p-1);
  });
  return [...out].sort((a,b)=>a-b);
}
async function getPdfDoc(file){
  await loadLib('pdfjs');
  const buf=await file.arrayBuffer();
  return pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
}
async function renderPage(page,scale,bg){
  const vp=page.getViewport({scale});
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(vp.width)); c.height=Math.max(1,Math.round(vp.height));
  const ctx=c.getContext('2d');
  ctx.fillStyle=bg||'#ffffff'; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return c;
}
function canvasBlob(c,type,q){ return new Promise(res=>c.toBlob(b=>res(b),type,q)); }
async function loadBitmap(file){

function miniMarkdown(src){

  h=h.replace(/^###### (.*)$/gm,'<h6>$1</h6>').replace(/^##### (.*)$/gm,'<h5>$1</h5>').replace(/^#### (.*)$/gm,'<h4>$1</h4>')
     .replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  h=h.replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');

async image2pdf(files,S,ctx){
  await loadLib('jspdf');

  const sorted=[...files].sort((a,b)=>S.sort==='time'?a.lastModified-b.lastModified:a.name.localeCompare(b.name));
  const makeOne=async(imgs,label)=>{
    const first=imgs[0].bmp;
    let fmt,orient;
    if(S.size==='fit'){ fmt=[first.width*0.75, first.height*0.75]; orient=first.width>first.height?'l':'p'; }
    else{ fmt=S.size==='a4'?'a4':'letter'; orient=S.orient==='auto'?(first.width>first.height?'l':'p'):S.orient; }
    const doc=new jsPDF({unit:'pt',format:fmt,orientation:orient,compress:true});
    for(let i=0;i<imgs.length;i++){
      if(i>0) doc.addPage(fmt,orient);
      const pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight();
      const m=+S.margin, iw=imgs[i].bmp.width||imgs[i].bmp.naturalWidth, ih=imgs[i].bmp.height||imgs[i].bmp.naturalHeight;
      const availW=pw-2*m, availH=ph-2*m;
      let dw,dh;
      if(S.fit==='cover'){ const s=Math.max(availW/iw,availH/ih); dw=iw*s; dh=ih*s; } else { const s=Math.min(availW/iw,availH/ih); dw=iw*s; dh=ih*s; }
      const x=(pw-dw)/2, y=(ph-dh)/2;
      if(S.bg&&S.bg.toLowerCase()!=='#ffffff'){ doc.setFillColor(S.bg); doc.rect(0,0,pw,ph,'F'); }
      doc.addImage(imgs[i].dataUrl,'JPEG',x,y,dw,dh,undefined,'FAST');
      if(S.numbers){ doc.setFontSize(9); doc.setTextColor(120); doc.text(String(i+1),pw/2,ph-14,{align:'center'}); }
      ctx.progress((i+1)/imgs.length);
    }
    return {name:label, blob:doc.output('blob')};
  };
  const collect=async f=>{ const bmp=await loadBitmap(f); const c=document.createElement('canvas');
    const maxDim=2400; let w=bmp.width,h=bmp.height; const sc=Math.min(1,maxDim/Math.max(w,h)); w=Math.round(w*sc);h=Math.round(h*sc);
    c.width=w;c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff';x.fillRect(0,0,w,h); x.drawImage(bmp,0,0,w,h);
    return {bmp,dataUrl:c.toDataURL('image/jpeg',+S.quality||.92)}; };
  if(S.mergeAll!==false && S.mergeAll!==undefined ? S.mergeAll : true){
    const imgs=[]; for(let i=0;i<sorted.length;i++){ ctx.log(sorted[i].name); imgs.push(await collect(sorted[i])); ctx.progress((i+1)/sorted.length*.5); }
    const out=await makeOne(imgs, sorted.length===1?stripExt(sorted[0].name)+'.pdf':'docuflow-merged.pdf');
    return [out];
  }
  const outs=[];
  for(let i=0;i<sorted.length;i++){ ctx.log(sorted[i].name); const im=[await collect(sorted[i])];
    outs.push(await makeOne(im,stripExt(sorted[i].name)+'.pdf')); ctx.progress((i+1)/sorted.length); }
  return outs;
},

async pdf2img(files,S,ctx){

      ctx.progress((fi+ (pi+1)/pages.length)/files.length);

},

async split(f,S,ctx){

    else if(/^\d+$/.test(p.trim())&&+p<=n) groups.push([+p-1]); });

async _ocr(file,S,ctx,pre){
  await loadLib('tesseract');
  let sources=[];
  if(pre==='pdf'){ await loadLib('pdfjs');
    const pdf=await getPdfDoc(file); const pages=parsePages(S.pages,pdf.numPages);
    for(const pi of pages){ const page=await pdf.getPage(pi+1); sources.push(await renderPage(page,2,'#ffffff')); ctx.progress(sources.length===1?0.3:0.1+0.2*sources.length/pdf.numPages); }
  } else { const bmp=await loadBitmap(file);
    const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
    c.getContext('2d').drawImage(bmp,0,0); sources=[c]; }
  let text='';
  for(let i=0;i<sources.length;i++){
    if(ctx.cancelled) throw {cancelled:true};
    const r=await Tesseract.recognize(sources[i],S.lang||'eng',{logger:m=>{ if(m.status==='recognizing text') ctx.progress(0.3+0.65*((i+m.progress)/sources.length)); }});
    text+=r.data.text.trim()+'\n\n';
  }
  return text.trim();
},

/* ---------- Image operations (canvas) ---------- */
async imgOps(files,S,ctx,mode){
  const fmt=S.format||'jpeg'; const mime=fmt==='png'?'image/png':fmt==='webp'?'image/webp':'image/jpeg'; const ext=fmt==='jpeg'?'jpg':fmt;
  const outs=[];
  for(let fi=0;fi<files.length;fi++){ ctx.log(files[fi].name);
    const bmp=await loadBitmap(files[fi]);
    let c=document.createElement('canvas');
    if(mode==='resize'){ const w=+S.w||bmp.width; const h=+S.h||Math.round(bmp.height*w/bmp.width); c.width=w;c.height=h; c.getContext('2d').drawImage(bmp,0,0,w,h); }
    else if(mode==='crop'){ const t=+S.t/100,b=+S.b/100,l=+S.l/100,r=+S.r/100;
      const sw=bmp.width*(1-l-r), sh=bmp.height*(1-t-b);
      if(sw<1||sh<1) throw new Error('Crop percentages remove the whole image.');
      c.width=Math.round(sw); c.height=Math.round(sh);
      c.getContext('2d').drawImage(bmp,bmp.width*l,bmp.height*t,sw,sh,0,0,sw,sh); }
    else if(mode==='rotate'){ const a=+S.angle; c.width=a===180?bmp.width:bmp.height; c.height=a===180?bmp.height:bmp.width;
      const x=c.getContext('2d'); x.translate(c.width/2,c.height/2); x.rotate(a*Math.PI/180); x.drawImage(bmp,-bmp.width/2,-bmp.height/2); }
    else { c.width=bmp.width;c.height=bmp.height; const x=c.getContext('2d');
      if(fmt==='jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}
      x.drawImage(bmp,0,0); }
    const b=await canvasBlob(c,mime,mode==='resize'&&fmt==='png'?undefined:(+S.quality||.9));
    const suffix={resize:'-resized',crop:'-cropped',rotate:'-rotated',compress:'-min',convert:''}[mode];
    outs.push({name:stripExt(files[fi].name)+suffix+'.'+ext,blob:b});
    ctx.progress((fi+1)/files.length);
  }
  return outs;
},
imgConvert(f,S,ctx){return Engines.imgOps(f,S,ctx,'convert')},

/* ---------- Signature ---------- */
async sign(files,S,ctx){
  if(!S._sig) throw new Error('Create a signature first.');
  const doc=await Engines._libLoad(files[0]);
  const dataUrl=S._sig; const png=await doc.embedPng(dataUrl);
  const pg=doc.getPage(Math.max(0,(+S.page||1)-1));
  const {width:w,height:h}=pg.getSize();
  const sw=w*(+S.w||28)/100; const sh=sw*png.height/png.width;
  pg.drawImage(png,{x:w*(+S.x||62)/100,y:h*(+S.y||8)/100,width:sw,height:sh});
  ctx.progress(1);
  return [{name:stripExt(files[0].name)+'-signed.pdf',blob:new Blob([await doc.save()],{type:'application/pdf'})}];
},

async function addFiles(list){
  const t=ws?ws.tool:null;
  if(!t)return;
  const errs=[];
  for(const file of list){
    const ext=getExt(file.name);
    const accept=t.ext.length===0||t.ext.includes(ext);
    if(!accept){ errs.push(`“${file.name}” — unsupported type (.${ext||'?'}). Expected: ${t.ext.join(', ').toUpperCase()||'text'}.`); continue; }
    if(file.size>100*1048576){ errs.push(`“${file.name}” exceeds the 100 MB limit.`); continue; }
    if(ws.files.some(f=>f.file.name===file.name&&f.file.size===file.size)){ errs.push(`“${file.name}” is already in the list.`); continue; }
    if(ws.files.length>=30){ errs.push('Maximum 30 files per task.'); break; }
    const rec={id:uid(),file,progress:0,pages:null};
    ws.files.push(rec);
    // simulate quick upload progress
    let p=0; const iv=setInterval(()=>{ p=Math.min(100,p+14+Math.random()*22); rec.progress=p; 
      const row=$(`.fcard[data-idx="${ws.files.indexOf(rec)}"] .fprog i`); if(row)row.style.width=p+'%';
      if(p>=100){clearInterval(iv); rec.progress=100;}
    },60);
    if(t.engine==='merge'||t.engine==='pro'){ // get page counts for PDFs
      getPdfDoc(file).then(pdf=>{ rec.pages=pdf.numPages; ws.totalPages=(ws.totalPages||0)+rec.pages; refreshWsLists(); }).catch(()=>{});
    }
  }
  errs.forEach(e=>toast('error','File rejected',e));
  if(ws.files.length){ ws.stage='config'; renderWs(); }
}
function refreshWsLists(){
  const l=$('#wsFileList'); if(l) l.innerHTML=ws.files.map(fileRowHTML).join('');
  const sum=$('.merge-sum'); if(sum&&ws.totalPages) sum.innerHTML=`${ic('merge')} <b>${ws.totalPages} pages</b> → <b>1 PDF</b>`;
}

/* drag-to-reorder (mouse/pen + keyboard buttons fallback) */
function bindSortList(){
  const list=$('#wsFileList'); if(!list)return;
  let dragIdx=null;
  list.querySelectorAll('.fcard').forEach(row=>{
    row.addEventListener('dragstart',()=>{ dragIdx=+row.dataset.idx; row.classList.add('dragging'); });
    row.addEventListener('dragend',()=>{ row.classList.remove('dragging'); list.querySelectorAll('.fcard').forEach(r=>r.classList.remove('over')); });
    row.addEventListener('dragover',e=>{ e.preventDefault(); row.classList.add('over'); });
    row.addEventListener('dragleave',()=>row.classList.remove('over'));
    row.addEventListener('drop',e=>{ e.preventDefault(); const to=+row.dataset.idx;
      if(dragIdx===null||dragIdx===to)return;
      const [m]=ws.files.splice(dragIdx,1); ws.files.splice(to,0,m);
      refreshWsLists(); bindSortList(); });
  });
}

/* ---------- Dropzones ---------- */
function bindDropzone(el, tool){
  if(!el)return;
  const input=document.createElement('input'); input.type='file'; input.multiple=true;
  input.accept=tool&&tool.ext.length?'.'+tool.ext.join(',.'):'';
  input.style.display='none'; el.appendChild(input);
  el.addEventListener('click',e=>{ if(!e.target.closest('button')||e.target.dataset.action==='ws-browse'||e.target.closest('[data-action=ws-browse]'))input.click(); });
  el.addEventListener('keydown',e=>{ if(e.key==='Enter')input.click(); });
  input.addEventListener('change',()=>{ addFiles([...input.files]); input.value=''; });
  ['dragenter','dragover'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.remove('drag');}));
  el.addEventListener('drop',e=>{ const fs=[...(e.dataTransfer?.files||[])]; if(fs.length)addFiles(fs); });
}

/* ---------- Processing ---------- */
async function processTool(){
  const t=ws.tool;
  if(!ws.files.length){ toast('warning','No files','Add at least one file first.'); return; }
  if(t.pro){ openUpgrade(t.name); return; }
  const S={...ws.settings};
  if(t.special==='t2i'){ return; } // handled by editor
  const steps=['File uploaded','Document analyzed','Processing','Finalizing'];
  const ov=document.createElement('div'); ov.className='proc-overlay'; ov.id='procOv';
  ov.innerHTML=`<div class="proc-box" role="alertdialog" aria-label="Processing">
    <div class="spinner-ring"></div>
    <h3>Processing your document</h3>
    <div class="proc-file" id="procFile"></div>
    <div class="pbar"><i id="procBar"></i></div>
    <div class="pct" id="procPct">0%</div>
    <ul class="steps">${steps.map((s,i)=>`<li id="st${i}"><span class="st">${ic('check','fill')}</span>${s}</li>`).join('')}</ul>
    <div class="proc-foot"><button class="btn btn-ghost btn-sm" id="procCancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(ov);
  const ctx={cancelled:false, progress:p=>{}, log:()=>{}, meta:null};
  $('#procCancel').addEventListener('click',()=>{ ctx.cancelled=true; });
  const setStep=i=>{ steps.forEach((_,j)=>{ const li=$('#st'+j); if(!li)return; li.classList.toggle('done',j<i); li.classList.toggle('active',j===i); }); };
  setStep(1);
  $('#st0').classList.add('done');
  const setPct=p=>{ p=Math.min(1,p); $('#procBar').style.width=(p*100).toFixed(1)+'%'; $('#procPct').textContent=Math.round(p*100)+'%'; };
  let pct=0;
  const ticker=setInterval(()=>{ if(pct<0.92)pct+=0.012*(1-pct); setPct(pct); },120);
  ctx.progress=p=>{ pct=Math.max(pct,p); setPct(p); };
  ctx.log=n=>{ $('#procFile').textContent=n; };
  // stage 2 after slight delay
  setTimeout(()=>{ $('#st1').classList.add('done'); setStep(2); },400);
  try{
    const files=ws.files.map(f=>f.file);
    let outputs;
    const perFileEngines=['pdf2text','pdf2md','pdf2html','pdf2docx','rotate','deletePages','extractPages','split','compress','watermark','pageNum','crop','editText','repair','sign','ocrImage','ocrPdf','img2xlsx','img2docx','text2pdf','text2docx','text2html','md2html','md2pdf','html2pdf','wordCount','checksum'];
    if(perFileEngines.includes(t.engine)&&files.length>1){
      outputs=[];
      for(let i=0;i<files.length;i++){
        if(ctx.cancelled)throw{cancelled:true};
        ctx.log(files[i].name);
        const base=(1/files.length);
        const sub={...ctx,progress:p=>ctx.progress(i*base+p*base)};
        outputs.push(...await runEngine(t.engine,[files[i]],S,sub));
      }
    } else {
      outputs=await runEngine(t.engine,files,S,ctx);
    }
    clearInterval(ticker); setPct(1);
    if(ctx.cancelled)throw{cancelled:true};
    setStep(4);
    setTimeout(()=>{ ov.remove(); showResults(outputs,ctx.meta); },350);
  }catch(err){
    clearInterval(ticker); ov.remove();
    if(err&&err.cancelled){ toast('info','Cancelled','The task was cancelled. Nothing was changed.'); return; }
    toast('error','Conversion failed', err.message||'Something went wrong while processing.');
  }
}

/* ---------- Results ---------- */
function showResults(outputs, meta){
  if(!outputs||!outputs.length){ toast('warning','Nothing produced','The tool ran but produced no output.'); return; }
  ws.outputs=outputs.map(o=>{ const url=URL.createObjectURL(o.blob); blobs.set(o.name,{blob:o.blob,url}); return {...o,url,id:uid()}; });
  // persist history metadata
  const recs=ws.outputs.map(o=>({id:o.id,name:o.name,size:o.blob.size,date:Date.now(),tool:ws.tool.name,toolId:ws.tool.id,status:'ready'}));
  state.history=[...recs,...state.history].slice(0,60); LS.set('history',state.history);
  const total=outputs.reduce((s,o)=>s+o.blob.size,0);
  app.innerHTML=headerHTML()+`<div class="container fade-in">
    <div class="results-hero">
      <div class="check-burst">${ic('check','fill')}</div>
      <h2>Your files are ready</h2>
      <p class="muted">${ws.outputs.length} file${ws.outputs.length>1?'s':''} · ${fmtSize(total)}${meta&&meta.pages?` · ${meta.pages} pages combined`:''} · processed locally</p>
    </div>
    <div class="results-grid">${ws.outputs.map((o,i)=>`

const t2i={text:'Every great document\ndeserves a great tool.',font:'Inter, sans-serif',size:56,weight:700,ls:0,lh:1.25,align:'center',color:'#0F172A',bg:'#635BFF',grad:false,grad2:'#8B5CF6',pad:80,radius:0,shadow:false,W:1080,H:1080,preset:'ig-post'};
function renderT2I(){
  const p=ws.settings;
  app.innerHTML=headerHTML()+`<div class="container sec" style="padding-top:30px">
    <div class="ws-head"><div class="ticon" style="--accent:#8B5CF6">${ic('type')}</div>
      <div><div class="crumb"><a href="#" data-action="go-tools">All Tools</a> ${ic('chevR')} TEXT</div><b style="font-size:20px">Text → Image</b></div></div>
    <div class="t2i-grid">
      <div class="panel">
        <h4>Presets</h4>
        <div class="preset-row">${[['ig-post','Instagram Post'],['ig-story','IG Story'],['li','LinkedIn'],['yt','YouTube Thumb'],['tw','X Post'],['custom','Custom']].map(x=>`<button class="chip ${t2i.preset===x[0]?'on':''}" data-preset="${x[0]}">${x[1]}</button>`).join('')}</div>
        <h4>Text</h4>
        <textarea class="t2i-text" id="t2iText" aria-label="Text content">${esc(t2i.text)}</textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px">
        <div class="field"><label for="t2iFont">Font</label><select id="t2iFont"><option value="Inter, sans-serif">Inter</option><option value="Georgia, serif">Georgia</option><option value="'Courier New', monospace">Courier</option><option value="Arial, sans-serif">Arial</option></select></div>
        <div class="field"><label for="t2iSize">Size <output id="oSize">${t2i.size}px</output></label><input type="range" id="t2iSize" min="20" max="120" value="${t2i.size}"></div>
        <div class="field"><label for="t2iWeight">Weight</label><select id="t2iWeight"><option>400</option><option>500</option><option>600</option><option>700</option><option>800</option></select></div>
        <div class="field"><label for="t2iAlign">Alignment</label><div class="seg" id="t2iAlignSeg">${['left','center','right'].map(a=>`<button class="${t2i.align===a?'on':''}" data-a="${a}">${a[0].toUpperCase()+a.slice(1)}</button>`).join('')}</div></div>
        <div class="field"><label for="t2iLh">Line height <output id="oLh">${t2i.lh}</output></label><input type="range" id="t2iLh" min="1" max="2.2" step=".05" value="${t2i.lh}"></div>
        <div class="field"><label for="t2iLs">Letter spacing <output id="oLs">${t2i.ls}px</output></label><input type="range" id="t2iLs" min="-3" max="14" step=".5" value="${t2i.ls}"></div>
        <div class="field"><label for="t2iPad">Padding <output id="oPad">${t2i.pad}px</output></label><input type="range" id="t2iPad" min="20" max="200" value="${t2i.pad}"></div>
        <div class="field"><label for="t2iRad">Corner radius <output id="oRad">${t2i.radius}px</output></label><input type="range" id="t2iRad" min="0" max="120" value="${t2i.radius}"></div>
        </div>
        <div class="field"><label>Colors</label><div style="display:flex;gap:16px;flex-wrap:wrap">
          <label class="color-row"><input type="color" id="t2iColor" value="${t2i.color}"><span>Text</span></label>
          <label class="color-row"><input type="color" id="t2iBg" value="${t2i.bg}"><span>Background</span></label>
          <label class="color-row"><input type="color" id="t2iBg2" value="${t2i.grad2}"><span>Gradient end</span></label>
          <label class="check-row"><input type="checkbox" id="t2iGrad" ${t2i.grad?'checked':''}> Gradient</label>
          <label class="check-row"><input type="checkbox" id="t2iShadow" ${t2i.shadow?'checked':''}> Text shadow</label>
        </div></div>
      </div>
      <div>
        <div class="t2i-stage"><canvas id="t2iCanvas" width="${t2i.W}" height="${t2i.H}" aria-label="Live preview of your text image"></canvas></div>
        <div class="convert-bar" style="display:flex;gap:10px">
          <button class="btn btn-primary btn-lg" style="flex:1" id="t2iPng">${ic('download')} Download PNG</button>
          <button class="btn btn-ghost btn-lg" id="t2iJpg">${ic('download')} JPG</button>
        </div>
      </div>
    </div></div>${footerHTML()}`;
  const c=$('#t2iCanvas');
  $('#t2iFont').value=t2i.font; $('#t2iWeight').value=String(t2i.weight);
  const draw=()=>{
    const x=c.getContext('2d'); const W=c.width=t2i.W,H=c.height=t2i.H;
    if(t2i.grad){ const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,t2i.bg); g.addColorStop(1,t2i.grad2); x.fillStyle=g; }
    else x.fillStyle=t2i.bg;
    x.fillRect(0,0,W,H);
    x.font=`${t2i.weight} ${t2i.size}px ${t2i.font}`;
    x.fillStyle=t2i.color; x.textAlign=t2i.align;
    if(t2i.shadow){ x.shadowColor='rgba(0,0,0,.35)'; x.shadowBlur=24; x.shadowOffsetY=6; }
    const lines=t2i.text.split('\n');
    const totalH=lines.length*t2i.size*t2i.lh;
    let y=(H-totalH)/2+t2i.size;
    const tw=W-2*t2i.pad;
    lines.forEach(line=>{
      // wrap long lines
      const words=line.split(' '); let cur='';
      const push=l=>{ 
        const xx=t2i.align==='left'?t2i.pad:t2i.align==='right'?W-t2i.pad:W/2;
        x.fillText(l,xx,y); y+=t2i.size*t2i.lh; };
      words.forEach(w=>{ const test=cur?cur+' '+w:w;
        if(x.measureText(test).width>tw&&cur){ push(cur); cur=w; } else cur=test; });
      push(cur);
    });
  };
  const bind=(id,fn)=>{ const el=$(id); el.addEventListener('input',()=>{fn(el);draw();}); };
  bind('#t2iText',el=>t2i.text=el.value);
  bind('#t2iFont',el=>t2i.font=el.value);
  bind('#t2iWeight',el=>t2i.weight=+el.value);
  bind('#t2iSize',el=>{t2i.size=+el.value;$('#oSize').textContent=el.value+'px';});
  bind('#t2iLh',el=>{t2i.lh=+el.value;$('#oLh').textContent=el.value;});
  bind('#t2iLs',el=>{t2i.ls=+el.value;$('#oLs').textContent=el.value+'px';});
  bind('#t2iPad',el=>{t2i.pad=+el.value;$('#oPad').textContent=el.value+'px';});
  bind('#t2iRad',el=>{t2i.radius=+el.value;$('#oRad').textContent=el.value+'px';});
  bind('#t2iColor',el=>t2i.color=el.value);
  bind('#t2iBg',el=>t2i.bg=el.value);
  bind('#t2iBg2',el=>t2i.grad2=el.value);
  bind('#t2iGrad',el=>t2i.grad=el.checked);
  bind('#t2iShadow',el=>t2i.shadow=el.checked);
  $$('#t2iAlignSeg button').forEach(b=>b.addEventListener('click',()=>{ $$('#t2iAlignSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); t2i.align=b.dataset.a; draw(); }));
  const presets={ 'ig-post':[1080,1080],'ig-story':[1080,1920],'li':[1200,627],'yt':[1280,720],'tw':[1200,675] };
  $$('[data-preset]').forEach(b=>b.addEventListener('click',()=>{
    $$('[data-preset]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); t2i.preset=b.dataset.preset;
    if(presets[b.dataset.preset]){ t2i.W=presets[b.dataset.preset][0]; t2i.H=presets[b.dataset.preset][1]; }
    draw();
  }));
  const save=fmt=>{ c.toBlob(b=>{ download(b,`docuflow-text-card.${fmt}`); toast('success','Image downloaded'); },fmt==='jpg'?'image/jpeg':'image/png',.95); };
  $('#t2iPng').addEventListener('click',()=>save('png'));
  $('#t2iJpg').addEventListener('click',()=>save('jpg'));
  draw();
}

/* =================================================================
   SIGNATURE TOOL
   ================================================================= */
function openSignaturePad(){
  let mode='draw', dataUrl=null;
  const bg=openModal({title:'Create your signature',wide:true,body:`
    <div class="sig-tabs"><div class="seg" style="width:280px" id="sigSeg"><button class="on" data-m="draw">Draw</button><button data-m="type">Type</button><button data-m="upload">Upload</button></div></div>
    <div id="sigBody"></div>`,
    footer:`<button class="btn btn-ghost" data-action="sig-clear">Clear</button><button class="btn btn-primary" data-action="sig-apply" disabled>Apply Signature</button>`});
  const body=bg.querySelector('#sigBody');
  const render=()=>{
    if(mode==='draw'){ body.innerHTML=`<div class="sig-canvas-wrap"><canvas id="sigCanvas"></canvas></div><p class="muted" style="font-size:12.5px;margin-top:8px">Draw your signature with mouse, pen or finger.</p>`;
      const c=bg.querySelector('#sigCanvas');
      c.width=c.offsetWidth*2; c.height=340;
      const x=c.getContext('2d'); x.lineWidth=5; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#1e2a4a';
      let drawing=false;
      const pos=e=>{ const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [(t.clientX-r.left)*2,(t.clientY-r.top)*2]; };
      const start=e=>{ drawing=true; const [a,b]=pos(e); x.beginPath(); x.moveTo(a,b); e.preventDefault(); };
      const move=e=>{ if(!drawing)return; const [a,b]=pos(e); x.lineTo(a,b); x.stroke(); e.preventDefault(); };
      const end=()=>{ drawing=false; if(x&&hasInk())enableApply(); };
      c.addEventListener('pointerdown',start); c.addEventListener('pointermove',move);
      window.addEventListener('pointerup',end);
      function hasInk(){ return !!c.toDataURL().length && drawingDone; }
      let drawingDone=false; c.addEventListener('pointerup',()=>drawingDone=true);
      window._sigGet=()=>{ if(!drawingDone)return null; const t=document.createElement('canvas'); t.width=c.width;t.height=c.height;
        t.getContext('2d').drawImage(c,0,0); return t.toDataURL('image/png'); };
      window._sigClear=()=>{ x.clearRect(0,0,c.width,c.height); drawingDone=false; disableApply(); };
    }
    else if(mode==='type'){ body.innerHTML=`<input class="field" id="sigType" type="text" placeholder="Type your name" style="width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px">
      <div class="sig-typed" id="sigPrev" style="margin-top:14px">Signature</div>`;
      const inp=bg.querySelector('#sigType'), prev=bg.querySelector('#sigPrev');
      inp.addEventListener('input',()=>{ prev.textContent=inp.value||'Signature'; if(inp.value.trim().length>1)enableApply(); else disableApply(); });
      window._sigGet=()=>{ if(!inp.value.trim())return null;
        const c=document.createElement('canvas'); c.width=800;c.height=260; const x=c.getContext('2d');
        x.font='120px "Segoe Script","Brush Script MT",cursive'; x.fillStyle='#1e2a4a'; x.textAlign='center'; x.textBaseline='middle';
        x.fillText(inp.value,400,140); return c.toDataURL('image/png'); };
      window._sigClear=()=>{ inp.value=''; prev.textContent='Signature'; disableApply(); };
    }
    else { body.innerHTML=`<div class="dropzone" id="sigDrop" style="padding:34px"><div class="dz-icon" style="width:52px;height:52px">${ic('image')}</div><p style="margin:0"><b>Upload a signature image</b><br><span class="muted" style="font-size:12.5px">PNG with transparency works best</span></p></div><div id="sigUpPrev" style="margin-top:12px;text-align:center"></div>`;
      const inp=document.createElement('input'); inp.type='file'; inp.accept='image/png,image/jpeg'; inp.style.display='none';
      body.appendChild(inp); bg.querySelector('#sigDrop').addEventListener('click',()=>inp.click());
      inp.addEventListener('change',()=>{ const f=inp.files[0]; if(!f)return;
        const r=new FileReader(); r.onload=()=>{ dataUrl=r.result;
          bg.querySelector('#sigUpPrev').innerHTML=`<img src="${dataUrl}" alt="Signature preview" style="max-height:120px">`; enableApply(); };
        r.readAsDataURL(f); });
      window._sigGet=()=>dataUrl;
      window._sigClear=()=>{ dataUrl=null; bg.querySelector('#sigUpPrev').innerHTML=''; disableApply(); };
    }
  };
  const enableApply=()=>bg.querySelector('[data-action=sig-apply]').disabled=false;
  const disableApply=()=>bg.querySelector('[data-action=sig-apply]').disabled=true;
  bg.querySelector('#sigSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
    bg.querySelectorAll('#sigSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.m; render(); });
  render();
  bg.querySelector('[data-action=sig-apply]').addEventListener('click',()=>{
    const url=window._sigGet&&window._sigGet();
    if(!url){ toast('warning','Nothing to apply','Create a signature first.'); return; }
    ws.settings._sig=url;
    closeModal();
    renderSignPlacement();
  });
}
async function renderSignPlacement(){
  const f=ws.files[0].file;
  await loadLib('pdfjs');
  const pdf=await getPdfDoc(f);
  const pageNo=Math.min(+ws.settings.page||1,pdf.numPages);
  const page=await pdf.getPage(pageNo);
  const scale=1.4;
  const c=await renderPage(page,scale,'#ffffff');
  const wrap=document.createElement('div');
  const vp=page.getViewport({scale});
  let sigX=62,sigY=8,sigW=28;
  const panel=$('#settingsForm');
  panel.innerHTML=`<p class="muted" style="font-size:13.5px;margin-bottom:12px">Click on the page to place your signature, then adjust size and position below.</p>
    <div class="field"><label>Horizontal <output id="oX">${sigX}%</output></label><input type="range" id="sigX" min="0" max="80" value="${sigX}"></div>
    <div class="field"><label>Vertical <output id="oY">${sigY}%</output></label><input type="range" id="sigY" min="0" max="92" value="${sigY}"></div>
    <div class="field"><label>Width <output id="oW">${sigW}%</output></label><input type="range" id="sigW" min="8" max="70" value="${sigW}"></div>
    <div class="field"><label for="sigPage">Page</label><input type="number" id="sigPage" min="1" max="${pdf.numPages}" value="${pageNo}"></div>
    <button class="btn btn-ghost btn-sm" id="sigRedo">${ic('pen')} Recreate signature</button>`;
  const stage=document.createElement('div');
  stage.className='t2i-stage'; stage.style.cssText='position:relative;padding:0;cursor:crosshair;overflow:hidden;margin-bottom:16px';
  c.style.maxWidth='100%'; c.style.display='block';
  const marker=document.createElement('img'); marker.src=ws.settings._sig;
  marker.style.cssText=`position:absolute;width:${sigW}%;left:${sigX}%;bottom:${sigY}%;pointer-events:none;opacity:.9`;
  stage.appendChild(c); stage.appendChild(marker);
  panel.parentElement.insertBefore(stage,panel);
  const sync=()=>{ marker.style.left=sigX+'%'; marker.style.bottom=sigY+'%'; marker.style.width=sigW+'%';
    $('#oX').textContent=sigX+'%'; $('#oY').textContent=sigY+'%'; $('#oW').textContent=sigW+'%'; };
  stage.addEventListener('click',e=>{ const r=stage.getBoundingClientRect();
    sigX=Math.round((e.clientX-r.left)/r.width*100)-sigW/2; sigY=Math.round((r.bottom-e.clientY)/r.height*100);
    sigX=Math.max(0,Math.min(100-sigW,sigX)); sigY=Math.max(0,Math.min(94,sigY)); sync(); });
  [['#sigX','sigX','#oX'],['#sigY','sigY','#oY'],['#sigW','sigW','#oW']].forEach(([id,key,o])=>{
    $(id).addEventListener('input',e=>{ ws.settings[key]=+e.target.value; ({sigX:sigX,sigY:sigY,sigW:sigW})[key]=+e.target.value; sync(); }); });
  $('#sigPage').addEventListener('change',e=>{ ws.settings.page=+e.target.value; });
  $('#sigRedo').addEventListener('click',()=>{ stage.remove(); openSignaturePad(); });
  sync();
}
