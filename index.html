<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ManiKutty — Free PDF & Document Toolkit</title>
<meta name="description" content="ManiKutty: every PDF and document tool — 100% free forever. Convert, merge, compress, OCR, sign, protect and more, privately in your browser.">
<meta name="theme-color" content="#635BFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#635BFF; --primary-h:#534AE0; --primary-soft:rgba(99,91,255,.1);
  --sky:#0EA5E9; --violet:#8B5CF6; --ok:#22C55E; --warn:#F59E0B; --err:#EF4444;
  --grad:linear-gradient(135deg,#635BFF,#8B5CF6 55%,#0EA5E9 125%);
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --elev:#FFFFFF;
  --border:#E2E8F0; --border-h:#CBD5E1;
  --text:#0F172A; --text-2:#475569; --text-3:#64748B;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 2px 6px rgba(15,23,42,.05),0 12px 32px -12px rgba(15,23,42,.12);
  --shadow-lg:0 4px 12px rgba(15,23,42,.06),0 24px 64px -16px rgba(15,23,42,.2);
  --glow:0 8px 24px -6px rgba(99,91,255,.45);
  --r:12px; --r-lg:16px; --r-xl:20px;
  --font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --t:180ms cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --primary:#7C74FF; --primary-h:#8E87FF; --primary-soft:rgba(124,116,255,.14);
  --bg:#0B0F1E; --surface:#111731; --surface-2:#1A2140; --elev:#161D3B;
  --border:#252E52; --border-h:#38426E;
  --text:#EAEEF9; --text-2:#A6AFCC; --text-3:#7C86A8;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 2px 6px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.5);
  --shadow-lg:0 4px 12px rgba(0,0,0,.35),0 24px 64px -16px rgba(0,0,0,.6);
  --glow:0 8px 24px -6px rgba(124,116,255,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background var(--t),color var(--t);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
img,svg{display:block}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
::selection{background:var(--primary-soft)}
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.02em;font-weight:700}
.muted{color:var(--text-3)}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:640px){.container{padding:0 16px}}
@media(max-width:760px){body{padding-bottom:84px}}
.ic{width:1.25em;height:1.25em;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill svg{fill:currentColor;stroke:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;border-radius:var(--r);padding:10px 18px;border:1px solid transparent;transition:all var(--t);white-space:nowrap;user-select:none;min-height:42px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px -6px rgba(99,91,255,.55);filter:brightness(1.06)}
.btn-ghost{border-color:var(--border);background:var(--surface);color:var(--text)}
.btn-ghost:hover{border-color:var(--border-h);background:var(--surface-2)}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-soft:hover{background:var(--primary);color:#fff}
.btn-danger{background:rgba(239,68,68,.1);color:var(--err)}
.btn-danger:hover{background:var(--err);color:#fff}
.btn-lg{padding:14px 26px;font-size:15px;border-radius:14px}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:10px;min-height:34px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;color:var(--text-3);transition:all var(--t);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.hdr{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.hdr-in{display:flex;align-items:center;gap:16px;height:66px;max-width:1280px;margin:0 auto;padding:0 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.03em;flex:none}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:2px;margin-left:8px}
.nav a{padding:8px 13px;border-radius:9px;font-size:14px;font-weight:500;color:var(--text-2);transition:all var(--t)}
.nav a:hover{color:var(--text);background:var(--surface-2)}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.free-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--ok);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);padding:5px 11px;border-radius:99px}
@media(max-width:1150px){.free-pill{display:none}}
.search-trigger{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:8px 12px;color:var(--text-3);font-size:13px;min-width:180px;transition:all var(--t)}
.search-trigger:hover{border-color:var(--primary)}
.search-trigger kbd{margin-left:auto;font-family:var(--font);font-size:11px;border:1px solid var(--border);border-radius:6px;padding:1px 6px;background:var(--surface-2)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:var(--glow)}
#hambBtn{display:none}
#mobileMenu{display:none}
#mobileMenu.open{display:block;position:fixed;inset:66px 0 0;background:var(--bg);z-index:80;padding:20px;overflow:auto}
#mobileMenu a,#mobileMenu button.mlink{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:12px;font-size:16px;font-weight:500;color:var(--text);text-align:left}
#mobileMenu a:hover,#mobileMenu button.mlink:hover{background:var(--surface-2)}
#mobileMenu .msep{height:1px;background:var(--border);margin:12px 0}
@media(max-width:960px){.nav,.search-trigger,#hdrAuth{display:none}#hambBtn{display:inline-flex}}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--text-3);padding:6px 0;border-radius:12px;transition:color var(--t)}
.bnav button.on,.bnav button:active{color:var(--primary)}
@media(max-width:760px){.bnav{display:grid}}
.hero{position:relative;overflow:hidden;padding:80px 0 64px}
.blob{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;opacity:.32}
.b1{width:440px;height:440px;background:#635BFF;top:-140px;left:-100px;animation:drift1 16s ease-in-out infinite alternate}
.b2{width:400px;height:400px;background:#0EA5E9;top:-60px;right:-120px;animation:drift2 19s ease-in-out infinite alternate}
.b3{width:320px;height:320px;background:#8B5CF6;bottom:-160px;left:38%;animation:drift1 22s ease-in-out infinite alternate-reverse}
[data-theme="dark"] .blob{opacity:.2}
@keyframes drift1{to{transform:translate(60px,40px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-50px,50px) scale(.92)}}
@media(prefers-reduced-motion:reduce){.blob,.pill-flow{animation:none}}
.hero-in{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;max-width:1200px;margin:0 auto;padding:0 24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);padding:6px 14px;border-radius:99px;margin-bottom:22px}
.hero h1{font-size:clamp(33px,4.8vw,56px);letter-spacing:-.035em;margin-bottom:18px;font-weight:900}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.hero p.lead{font-size:17px;color:var(--text-2);max-width:520px;margin-bottom:28px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.hero-meta{display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--text-3)}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta .ic{color:var(--ok)}
.up-card{background:color-mix(in srgb,var(--elev) 86%,transparent);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:14px;position:relative;backdrop-filter:blur(8px)}
.up-card-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 12px;font-size:13px;font-weight:600;color:var(--text-3)}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--border)}
.dropzone{position:relative;border:2px dashed var(--border-h);border-radius:var(--r-lg);padding:44px 24px;text-align:center;transition:all var(--t);cursor:pointer;background:var(--surface)}
.dropzone:hover,.dropzone.drag{border-color:var(--primary);background:var(--primary-soft)}
.dz-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--glow)}
.dz-icon .ic{width:30px;height:30px}
.dropzone h3{font-size:17px;margin-bottom:6px}
.dropzone p{font-size:13px;color:var(--text-3);margin-bottom:16px}
.fmt-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.fmt{font-size:10.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--border);border-radius:6px;padding:3px 7px;color:var(--text-3);background:var(--surface-2)}
.up-privacy{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;font-size:12.5px;color:var(--text-3)}
.up-privacy .ic{color:var(--ok);width:1.05em;height:1.05em}
@media(max-width:900px){.hero-in{grid-template-columns:1fr;gap:36px;padding-top:8px}.hero{padding:56px 0 48px}}
.pill-flow{position:absolute;font-size:11.5px;font-weight:600;background:var(--elev);border:1px solid var(--border);border-radius:99px;padding:6px 12px;box-shadow:var(--shadow);color:var(--text-2);display:flex;gap:6px;align-items:center;animation:floaty 7s ease-in-out infinite;pointer-events:none;z-index:2}
.pill-flow .ic{width:1.05em;height:1.05em}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.stat-band{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:900px;margin:0 auto}
.stat-band .stat{text-align:center;border:none;background:transparent;box-shadow:none;padding:10px}
.stat-band b{font-size:clamp(28px,4vw,40px);letter-spacing:-.04em;display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.stat-band span{font-size:12.5px;color:var(--text-3);font-weight:600}
@media(max-width:640px){.stat-band{grid-template-columns:repeat(2,1fr)}}
.sec{padding:64px 0}
.sec-mark{width:44px;height:5px;border-radius:99px;background:var(--grad);margin-bottom:14px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:30px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(24px,3vw,32px)}
.sec-head p{color:var(--text-3);margin-top:6px;max-width:560px}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.tcard{position:relative;background:var(--elev);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:10px;transition:all var(--t);cursor:pointer;overflow:hidden}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent,var(--primary)) 45%,var(--border))}
.tcard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--primary));opacity:0;transition:opacity var(--t)}
.tcard:hover::after{opacity:1}
.tcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ticon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--accent,var(--primary));background:linear-gradient(135deg,color-mix(in srgb,var(--accent,var(--primary)) 16%,transparent),color-mix(in srgb,var(--accent,var(--primary)) 5%,transparent));transition:transform var(--t)}
.tcard:hover .ticon{transform:scale(1.08) rotate(-3deg)}
.ticon .ic{width:22px;height:22px}
.fav-btn{color:var(--text-3);opacity:0;transition:all var(--t)}
.tcard:hover .fav-btn,.fav-btn.on{opacity:1}
.fav-btn.on{color:var(--warn)}
.fav-btn.on .ic svg{fill:currentColor}
.tcard h3{font-size:15px;font-weight:700}
.tcard .desc{font-size:13px;color:var(--text-3);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-3)}
.tcard-foot .go{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--accent,var(--primary));font-size:13px}
.tcard:hover .go .ic{transform:translateX(3px)}
.go .ic{transition:transform var(--t)}
.free-tag{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--ok);background:rgba(34,197,94,.1);border-radius:5px;padding:2px 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 15px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all var(--t);min-height:38px}
.chip:hover{border-color:var(--border-h)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.tools-toolbar{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 14px;transition:border var(--t)}
.search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:14px;min-width:0}
.search-box .ic{color:var(--text-3)}
.empty{padding:60px 20px;text-align:center;color:var(--text-3)}
.empty .ic{width:44px;height:44px;margin:0 auto 14px;opacity:.5}
.ws-head{display:flex;align-items:center;gap:14px;padding:22px 0;flex-wrap:wrap}
.ws-head .ticon{width:48px;height:48px}
.crumb{font-size:13px;color:var(--text-3);margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb b{color:var(--text);font-size:20px;letter-spacing:-.02em}
.ws-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;padding-bottom:40px}
@media(max-width:900px){.ws-grid{grid-template-columns:1fr}}
.panel{background:var(--elev);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.panel h4{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-bottom:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel + .panel{margin-top:16px}
.fcard{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:11px;background:var(--surface);margin-bottom:10px;transition:all var(--t)}
.fcard:hover{border-color:var(--border-h);box-shadow:var(--shadow-sm)}
.fthumb{width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fmeta{flex:1;min-width:0}
.fmeta .fname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta .fsub{font-size:11.5px;color:var(--text-3)}
.fprog{height:4px;background:var(--surface-2);border-radius:99px;margin-top:6px;overflow:hidden}
.fprog i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .3s;width:0}
.facts{display:flex;gap:2px;flex:none}
.field{margin-bottom:16px}
.field label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text-2)}
.field label output{color:var(--primary);font-variant-numeric:tabular-nums}
.field select,.field input[type=text],.field input[type=number],.field input[type=password],.field textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14px;transition:border var(--t);outline:none;min-height:42px}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field input[type=range]{width:100%;accent-color:var(--primary)}
.field input[type=color]{width:46px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:2px;cursor:pointer}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;font-size:12.5px;font-weight:600;color:var(--text-3);background:var(--surface);transition:all var(--t);min-height:40px}
.seg button.on{background:var(--grad);color:#fff}
.check-row{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;cursor:pointer;padding:4px 0}
.check-row input{width:18px;height:18px;accent-color:var(--primary)}
.color-row{display:flex;align-items:center;gap:10px}
.color-row span{font-size:13px;color:var(--text-3)}
.convert-bar{margin-top:18px}
@media(max-width:900px){.convert-bar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));z-index:30;padding:12px 0;background:linear-gradient(0deg,var(--bg) 70%,transparent)}.convert-bar .btn{width:100%;box-shadow:var(--shadow-lg)}}
.engine-note{font-size:12.5px;color:var(--text-3);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:4px;display:flex;gap:8px}
.engine-note .ic{color:var(--sky);flex:none;margin-top:2px}
.proc-overlay{position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.proc-box{background:var(--elev);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);width:min(480px,100%);padding:34px}
.spinner-ring{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;border:4px solid var(--primary-soft);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.proc-box h3{text-align:center;font-size:19px;margin-bottom:6px}
.proc-file{text-align:center;font-size:13px;color:var(--text-3);margin-bottom:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:8px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .25s;width:0}
.pct{font-size:13px;font-weight:700;color:var(--primary);text-align:right;font-variant-numeric:tabular-nums;margin-bottom:20px}
.steps{list-style:none;margin-bottom:24px}
.steps li{display:flex;align-items:center;gap:11px;padding:7px 0;font-size:14px;color:var(--text-3);transition:color var(--t)}
.steps li .st{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-h);flex:none;display:flex;align-items:center;justify-content:center;transition:all var(--t)}
.steps li .st .ic{width:11px;height:11px;opacity:0;color:#fff}
.steps li.done{color:var(--text)}
.steps li.done .st{background:var(--ok);border-color:var(--ok)}
.steps li.done .st .ic{opacity:1}

function parsePages(str,total){
  if(!str||!str.trim())return Array.from({length:total},(_,i)=>i);
  const out=new Set();
  str.split(',').forEach(p=>{
    const m=p.trim().match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){for(let i=+m[1];i<=+m[2];i++)if(i>=1&&i<=total)out.add(i-1)}
    else if(/^\d+$/.test(p.trim())&&+p>=1&&+p<=total)out.add(+p-1);
  });
  return [...out].sort((a,b)=>a-b);
}

  const ops=[];
  let s=0;while(s<A.length&&s<B.length&&A[s]===B[s]){ops.push(['same',A[s]]);s++}
  let e=0;while(e<A.length-s&&e<B.length-s&&A[A.length-1-e]===B[B.length-1-e])e++;
  const a=A.slice(s,A.length-e),b=B.slice(s,B.length-e);
  if(a.length&&b.length&&a.length<=2200&&b.length<=2200&&a.length*b.length<=2000000){
    const m=a.length,n=b.length,W=n+1;
    const dp=new Int32Array((m+1)*W);
    for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)
      dp[i*W+j]=a[i]===b[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
    let i=0,j=0;
    while(i<m&&j<n){
      if(a[i]===b[j]){ops.push(['same',a[i]]);i++;j++}
      else if(dp[(i+1)*W+j]>=dp[i*W+j+1]){ops.push(['del',a[i]]);i++}
      else{ops.push(['ins',b[j]]);j++}
    }
    while(i<m)ops.push(['del',a[i++]]);
    while(j<n)ops.push(['ins',b[j++]]);
  }else{a.forEach(w=>ops.push(['del',w]));b.forEach(w=>ops.push(['ins',w]))}
  for(let k=A.length-e;k<A.length;k++)ops.push(['same',A[k]]);
  return ops;
}
async function runEngine(engine,files,S,ctx){
  const fn=Engines[engine];
  if(!fn)throw new Error('Engine unavailable.');
  return fn(files,S,ctx);
}

  if(f.type==='select')return `<div class="field"><label for="${id}">${f.label}</label><select id="${id}" data-set="${f.key}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
  if(f.type==='range')return `<div class="field"><label for="${id}">${f.label} <output id="o_${f.key}">${val}${f.unit||''}</output></label><input id="${id}" type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}" data-set="${f.key}" data-unit="${f.unit||''}"></div>`;

async function addFiles(list){
  const t=ws?ws.tool:null;if(!t)return;
  const errs=[];
  for(const file of list){
    const ext=getExt(file.name);
    if(t.ext.length&&!(t.ext.includes(ext))){errs.push(`“${file.name}” — unsupported type (.${ext||'?'}). Expected: ${t.ext.join(', ').toUpperCase()}.`);continue}
    if(file.size>100*1048576){errs.push(`“${file.name}” exceeds the 100 MB limit.`);continue}
    if(ws.files.some(f=>f.file.name===file.name&&f.file.size===file.size)){errs.push(`“${file.name}” is already in the list.`);continue}
    if(t.special==='compare'&&ws.files.length>=2){errs.push('Compare needs exactly two files — remove one first.');break}
    if(ws.files.length>=30){errs.push('Maximum 30 files per task.');break}
    const rec={id:uid(),file,progress:0,pages:null};
    ws.files.push(rec);
    let p=0;
    const iv=setInterval(()=>{p=Math.min(100,p+14+Math.random()*22);rec.progress=p;
      const row=$(`.fcard[data-idx="${ws.files.indexOf(rec)}"] .fprog i`);if(row)row.style.width=p+'%';
      if(p>=100){clearInterval(iv);rec.progress=100}},60);
    if(t.engine==='merge'||t.engine==='compare'){
      getPdfDoc(file).then(pdf=>{rec.pages=pdf.numPages;ws.totalPages=(ws.totalPages||0)+rec.pages;refreshWsLists()}).catch(()=>{});
    }
  }
  errs.forEach(e=>toast('error','File rejected',e));
  if(ws.files.length){
    if(t.special!=='compare')ws.stage='config';
    renderWs();
    if(t.special==='compare'&&ws.files.length===2)toast('info','Ready to compare','Both versions loaded — hit “Compare PDFs”.');
  }
}

async function processTool(){
  const t=ws.tool;
  if(!ws.files.length){toast('warning','No files','Add at least one file first.');return}
  if(t.engine==='compare'&&ws.files.length!==2){toast('warning','Two files needed','Compare works on exactly two PDF versions.');return}
  if(t.engine==='sign'&&!ws.settings._sig){toast('warning','Signature needed','Tap “Create Signature” first.');return}
  if(t.engine==='protect'&&!ws.settings.pw){toast('warning','Password needed','Enter an open password in Settings.');return}
  const S={...ws.settings};
  const steps=['File uploaded','Document analyzed','Processing','Finalizing'];
  const ov=document.createElement('div');ov.className='proc-overlay';ov.id='procOv';
  ov.innerHTML=`<div class="proc-box" role="alertdialog" aria-label="Processing">
    <div class="spinner-ring"></div>
    <h3>Processing your document</h3>
    <div class="proc-file" id="procFile"></div>
    <div class="pbar"><i id="procBar"></i></div>
    <div class="pct" id="procPct">0%</div>
    <ul class="steps">${steps.map((s,i)=>`<li id="st${i}"><span class="st">${ic('check','fill')}</span>${s}</li>`).join('')}</ul>
    <div class="proc-foot"><button class="btn btn-ghost btn-sm" id="procCancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(ov);
  const ctx={cancelled:false,progress:()=>{},log:()=>{},meta:null};
  $('#procCancel').addEventListener('click',()=>{ctx.cancelled=true});
  const setStep=i=>{steps.forEach((_,j)=>{const li=$('#st'+j);if(!li)return;li.classList.toggle('done',j<i);li.classList.toggle('active',j===i)})};
  $('#st0').classList.add('done');setStep(1);
  const setPct=p=>{p=Math.min(1,p);$('#procBar').style.width=(p*100).toFixed(1)+'%';$('#procPct').textContent=Math.round(p*100)+'%'};
  let pct=0;
  const ticker=setInterval(()=>{if(pct<0.92)pct+=0.012*(1-pct);setPct(pct)},120);
  ctx.progress=p=>{pct=Math.max(pct,p);setPct(p)};
  ctx.log=n=>{$('#procFile').textContent=n};
  setTimeout(()=>{$('#st1').classList.add('done');setStep(2)},400);
  try{
    const files=ws.files.map(f=>f.file);
    const perFileEngines=['pdf2text','pdf2md','pdf2html','pdf2docx','rotate','deletePages','extractPages','split','compress','watermark','pageNum','crop','editText','repair','sign','ocrImage','ocrPdf','img2xlsx','img2docx','text2pdf','text2docx','text2html','md2html','md2pdf','html2pdf','wordCount','checksum','protect','unlock','pdf2ppt','ppt2pdf','ppt2img','word2pdf','word2text','word2html','word2img','xlsx2csv','csv2xlsx','xlsx2pdf','xlsx2img','image2pdf','pdf2img','pdf2xlsx','compare'];
    let outputs;
    if(perFileEngines.includes(t.engine)&&files.length>1&&t.engine!=='compare'&&t.engine!=='merge'&&t.engine!=='image2pdf'){
      outputs=[];
      for(let i=0;i<files.length;i++){
        if(ctx.cancelled)throw{cancelled:true};
        ctx.log(files[i].name);
        const base=1/files.length;
        const sub={...ctx,progress:p=>ctx.progress(i*base+p*base)};
        outputs.push(...await runEngine(t.engine,[files[i]],S,sub));
      }
    }else outputs=await runEngine(t.engine,files,S,ctx);
    clearInterval(ticker);setPct(1);
    if(ctx.cancelled)throw{cancelled:true};
    setStep(4);
    setTimeout(()=>{ov.remove();showResults(outputs,ctx.meta)},350);
  }catch(err){
    clearInterval(ticker);ov.remove();
    if(err&&err.cancelled){toast('info','Cancelled','The task was cancelled. Nothing was changed.');return}
    toast('error','Processing failed',err.message||'Something went wrong while processing.');
  }
}

    else if(mode==='type'){
      body.innerHTML=`<input class="field" id="sigType" type="text" placeholder="Type your name" style="width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px">
      <div class="sig-typed" id="sigPrev" style="margin-top:14px">Signature</div>`;
      const inp=bg.querySelector('#sigType'),prev=bg.querySelector('#sigPrev');
      inp.addEventListener('input',()=>{prev.textContent=inp.value||'Signature';inp.value.trim().length>1?enableApply():disableApply()});
      window._sigGet=()=>{if(!inp.value.trim())return null;
        const c=document.createElement('canvas');c.width=800;c.height=260;const x=c.getContext('2d');
        x.font='110px "Segoe Script","Brush Script MT",cursive';x.fillStyle='#1e2a4a';x.textAlign='center';x.textBaseline='middle';
        x.fillText(inp.value,400,140);return c.toDataURL('image/png')};
      window._sigClear=()=>{inp.value='';prev.textContent='Signature';disableApply()};
    }
    else{
      body.innerHTML=`<div class="dropzone" id="sigDrop" style="padding:34px"><div class="dz-icon" style="width:52px;height:52px">${ic('upload')}</div><p style="margin:0"><b>Upload a signature image</b><br><span class="muted" style="font-size:12.5px">PNG with transparency works best</span></p></div><div id="sigUpPrev" style="margin-top:12px;text-align:center"></div>`;
      let dataUrl=null;
      const inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/jpeg';inp.style.display='none';
      body.appendChild(inp);
      bg.querySelector('#sigDrop').addEventListener('click',()=>inp.click());
      inp.addEventListener('change',()=>{const f=inp.files[0];if(!f)return;
        const r=new FileReader();r.onload=()=>{dataUrl=r.result;
          bg.querySelector('#sigUpPrev').innerHTML=`<img src="${dataUrl}" alt="Signature preview" style="max-height:120px;margin:0 auto">`;enableApply()};
        r.readAsDataURL(f)});
      window._sigGet=()=>dataUrl;
      window._sigClear=()=>{dataUrl=null;bg.querySelector('#sigUpPrev').innerHTML='';disableApply()};
    }
  };
  bg.querySelector('#sigSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    bg.querySelectorAll('#sigSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;render()});
  bg.querySelector('#sigApply').addEventListener('click',()=>{
    const url=window._sigGet&&window._sigGet();
    if(!url){toast('warning','Nothing to apply','Create a signature first.');return}
    ws.settings._sig=url;
    closeModal();
    renderWs();
    toast('success','Signature ready','Now click on the page preview to place it.');
  });
  render();
}
async function renderSignPlacement(){
  const f=ws.files[0].file;
  try{
    await loadLib('pdfjs');
    const pdf=await getPdfDoc(f);
    const pageNo=Math.min(Math.max(1,+ws.settings.page||1),pdf.numPages);
    ws.settings.page=pageNo;
    const page=await pdf.getPage(pageNo);
    const c=await renderPage(page,1.3,'#ffffff');
    const panel=$('#settingsForm');if(!panel)return;
    panel.innerHTML=`
      <p class="muted" style="font-size:13.5px;margin-bottom:12px">Click on the page to place your signature, then fine-tune below.</p>
      <div class="field"><label>Horizontal <output id="oX">${ws.settings.x??62}%</output></label><input type="range" id="sigX" min="0" max="90" value="${ws.settings.x??62}"></div>
      <div class="field"><label>Vertical <output id="oY">${ws.settings.y??8}%</output></label><input type="range" id="sigY" min="0" max="92" value="${ws.settings.y??8}"></div>
      <div class="field"><label>Width <output id="oW">${ws.settings.w??28}%</output></label><input type="range" id="sigW" min="8" max="70" value="${ws.settings.w??28}"></div>
      <div class="field"><label for="sigPage">Page</label><input type="number" id="sigPage" min="1" max="${pdf.numPages}" value="${pageNo}"></div>
      <button class="btn btn-ghost btn-sm" data-action="sig-open" style="width:100%">${ic('pen')} Recreate signature</button>`;
    const oldStage=$('.t2i-stage[data-sigstage]');if(oldStage)oldStage.remove();
    const stage=document.createElement('div');
    stage.className='t2i-stage';stage.dataset.sigstage='1';
    stage.style.cssText='position:relative;padding:0;cursor:crosshair;overflow:hidden;margin-bottom:16px';
    c.style.maxWidth='100%';c.style.display='block';
    const marker=document.createElement('img');marker.src=ws.settings._sig;marker.alt='Signature placement';
    marker.style.cssText=`position:absolute;width:${ws.settings.w??28}%;left:${ws.settings.x??62}%;bottom:${ws.settings.y??8}%;pointer-events:none;opacity:.9`;
    stage.appendChild(c);stage.appendChild(marker);
    panel.parentElement.insertBefore(stage,panel);
    const sync=()=>{marker.style.left=(ws.settings.x??62)+'%';marker.style.bottom=(ws.settings.y??8)+'%';marker.style.width=(ws.settings.w??28)+'%';
      $('#oX').textContent=(ws.settings.x??62)+'%';$('#oY').textContent=(ws.settings.y??8)+'%';$('#oW').textContent=(ws.settings.w??28)+'%'};
    stage.addEventListener('click',e=>{const r=stage.getBoundingClientRect();
      const wPct=ws.settings.w??28;
      ws.settings.x=Math.max(0,Math.min(100-wPct,Math.round((e.clientX-r.left)/r.width*100)-wPct/2));
      ws.settings.y=Math.max(0,Math.min(94,Math.round((r.bottom-e.clientY)/r.height*100)));
      sync()});
    [['#sigX','x'],['#sigY','y'],['#sigW','w']].forEach(([id,key])=>{
      $(id).addEventListener('input',e=>{ws.settings[key]=+e.target.value;sync()})});
    $('#sigPage').addEventListener('change',e=>{ws.settings.page=+e.target.value;renderSignPlacement()});
  }catch(err){toast('error','Preview failed',err.message)}
}
/* ---------- Dashboard ---------- */
function viewDash(){
  const tabs=[['overview','Dashboard','grid'],['tools','All Tools','zap'],['recent','Recent Files','clock'],['favs','Favorites','star'],['trash','Trash','trash'],['settings','Settings','sliders']];
  let totalSize=0;blobs.forEach(v=>totalSize+=v.blob.size);
  const used=Math.min(totalSize,100*1048576);
  const content={
    overview:()=>{
      const qa=['image-to-pdf','merge-pdf','compress-pdf','pdf-to-word','pdf-to-excel','pdf-to-image','protect-pdf','ocr-pdf'].map(id=>byId[id]).filter(Boolean);
      return `<h2 style="font-size:26px;margin-bottom:4px">Welcome back${state.user?', '+esc(state.user.split('@')[0]):''}.</h2>
      <p class="muted" style="margin-bottom:6px">Your document command center. Everything runs locally — and everything is free.</p>
      <div class="stat-row">
        <div class="stat"><b>${state.history.length}</b><span>Files created</span></div>
        <div class="stat"><b>${state.recentTools.length}</b><span>Tools tried</span></div>
        <div class="stat"><b>${state.favorites.length}</b><span>Favorite tools</span></div>
        <div class="stat"><b>${fmtSize(used)}</b><span>Session workspace</span></div>
      </div>
      <h3 style="font-size:15px;margin:26px 0 14px">Quick actions</h3>
      <div class="qgrid">${qa.map(t=>`<button class="qact" data-action="open-tool" data-id="${t.id}"><span class="ticon" style="--accent:${catColor(t.cat)}">${typeIcon('PDF',catColor(t.cat))}</span><b>${esc(t.name)}</b><span class="muted" style="font-size:12px">${esc(t.out)}</span></button>`).join('')}</div>
      <h3 style="font-size:15px;margin:30px 0 14px">Recent files</h3>${recentTableHTML(6)}`;
    },
    tools:()=>`<h2 style="font-size:24px;margin-bottom:20px">All tools</h2><div class="tools-grid">${TOOLS.slice(0,24).map(toolCardHTML).join('')}</div>`,
    recent:()=>`<h2 style="font-size:24px;margin-bottom:20px">Recent files</h2>${recentTableHTML(60)}`,
    favs:()=>`<h2 style="font-size:24px;margin-bottom:20px">My favorite tools</h2>${state.favorites.length?`<div class="tools-grid">${state.favorites.map(id=>byId[id]).filter(Boolean).map(toolCardHTML).join('')}</div>`:`<div class="empty">${ic('star')}<h3>No favorites yet</h3><p>Tap the star on any tool card to pin it here.</p></div>`}`,
    trash:()=>{const items=state.trash;return `<h2 style="font-size:24px;margin-bottom:20px">Trash</h2>${items.length?recentTableHTML(60,true):`<div class="empty">${ic('trash')}<h3>Trash is empty</h3><p>Deleted items rest here until you clear them.</p></div>`}`},
    settings:()=>`<h2 style="font-size:24px;margin-bottom:20px">Settings</h2>
      <div class="panel" style="max-width:520px">
        <h4>Appearance</h4>
        <label class="check-row"><input type="checkbox" id="setTheme" ${state.theme==='dark'?'checked':''}> Dark mode</label>
        <div class="divider"></div>
        <h4>Account <span class="free-tag">optional</span></h4>
        ${state.user?`<p style="font-size:14px;margin-bottom:12px">Signed in as <b>${esc(state.user)}</b></p><button class="btn btn-ghost btn-sm" data-action="logout">Sign out</button>`
          :`<p class="muted" style="font-size:13.5px;margin-bottom:12px">ManiKutty works fully without an account.</p><button class="btn btn-primary btn-sm" data-action="login">Log in</button>`}
        <div class="divider"></div>
        <h4>Data</h4>
        <button class="btn btn-danger btn-sm" data-action="clear-data">${ic('trash')} Clear all local data</button>
        <p class="muted" style="font-size:12.5px;margin-top:10px">Removes history, favorites and preferences stored in this browser.</p>
      </div>`,
  };
  app.innerHTML=headerHTML()+`<div class="dash">
    <aside class="dside"><nav aria-label="Dashboard sections">
      ${tabs.map(t=>`<button class="${state.dashTab===t[0]?'on':''}" data-action="dash-tab" data-tab="${t[0]}">${ic(t[2])} ${t[1]}</button>`).join('')}
    </nav>
    <div class="storage"><b style="font-size:13px">Session workspace</b>
      <div class="pbar"><i style="width:${used/(1048576*100)*100}%"></i></div>
      <span class="muted" style="font-size:12px">${fmtSize(used)} of 100 MB</span></div>
    </aside>
    <main>${(content[state.dashTab]||content.overview)()}</main>
  </div>`;
  const st=$('#setTheme');if(st)st.addEventListener('change',()=>setTheme(st.checked?'dark':'light'));
}
function recentTableHTML(limit,trash=false){
  const items=(trash?state.trash:state.history).slice(0,limit);
  if(!items.length)return `<div class="empty">${ic('folder')}<h3>Nothing here yet</h3><p>Files you create will show up in this list.</p></div>`;
  return `<div class="panel" style="padding:6px 4px"><div class="ftable-wrap"><table class="ftable">
    <thead><tr><th>File</th><th>Tool</th><th>Size</th><th>Created</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody>${items.map(r=>{const t=byId[r.toolId]||{};return `<tr>
      <td class="fname" title="${esc(r.name)}">${typeIcon(getExt(r.name),catColor(t.cat))}<span style="vertical-align:middle">${esc(r.name)}</span></td>
      <td class="muted">${esc(r.tool)}</td><td class="muted">${fmtSize(r.size)}</td><td class="muted">${timeAgo(r.date)}</td>
      <td style="text-align:right;white-space:nowrap">
        ${blobs.has(r.id)&&!trash?`<button class="icon-btn" data-action="dl" data-id="${r.id}" aria-label="Download">${ic('download')}</button>`:''}
        ${trash
          ?`<button class="icon-btn" data-action="restore" data-id="${r.id}" aria-label="Restore">${ic('refresh')}</button>`
          :`<button class="icon-btn" data-action="again-tool" data-id="${r.toolId}" aria-label="Convert again with ${esc(r.tool)}">${ic('refresh')}</button>
            <button class="icon-btn" data-action="trash-move" data-id="${r.id}" aria-label="Move to trash">${ic('trash')}</button>`}
      </td></tr>`}).join('')}</tbody></table></div></div>`;
}
/* ---------- Auth (optional, free) ---------- */
function openAuth(){
  openModal({title:'Log in — optional, always free',body:`
    <p class="muted" style="font-size:13.5px;margin-bottom:14px">An account is never required in ManiKutty. Logging in just personalizes your dashboard. Credentials stay in your browser only.</p>
    <form id="authForm" style="display:grid;gap:14px">
      <div class="field"><label for="auMail">Email</label><input id="auMail" type="email" required placeholder="you@example.com"></div>
      <div class="field"><label for="auPass">Password</label><input id="auPass" type="password" required minlength="4" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-lg" type="submit" style="width:100%">Log in</button>
    </form>`});
  $('#authForm').addEventListener('submit',e=>{
    e.preventDefault();
    state.user=$('#auMail').value;LS.set('user',state.user);
    closeModal();toast('success','Signed in',`Welcome, ${state.user}`);
    rerender();
  });
}
function openPreview(id){
  const o=blobs.get(id);if(!o)return;
  const isImg=/^image\//.test(o.blob.type);
  openModal({title:esc(o.name),wide:true,body:isImg
    ?`<img src="${o.url}" alt="Preview of ${esc(o.name)}" style="max-width:100%;max-height:60vh;border-radius:12px;margin:0 auto;display:block">`
    :o.blob.type==='text/html'
      ?`<iframe class="preview-frame" src="${o.url}" title="Report preview"></iframe>`
      :`<div class="empty">${typeIcon(getExt(o.name),catColor((ws&&ws.tool||{}).cat))}<h3>${esc(o.name)}</h3><p>${fmtSize(o.blob.size)} · preview available for image and HTML outputs</p></div>`,
    footer:`<button class="btn btn-primary" data-action="dl" data-id="${id}">${ic('download')} Download</button>`});
}
function openShortcuts(){
  openModal({title:'Keyboard shortcuts',body:
    [['/','Focus tool search'],['Ctrl / ⌘ + O','Open file picker'],['Ctrl / ⌘ + S','Download current result'],['Ctrl / ⌘ + K','Toggle dark mode'],['Esc','Close dialog'],['?','This dialog']].map(k=>`<div class="klist"><span>${k[1]}</span><span class="kbd">${k[0]}</span></div>`).join('')});
}
/* =================================================================
   GLOBAL EVENTS
   ================================================================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const a=el.dataset.action;
  const acts={
    'go-home':()=>{e.preventDefault();go('home')},
    'go-tools':()=>{e.preventDefault();go('tools')},
    'go-dash':()=>{e.preventDefault();go('dash')},
    'go-cat':()=>{e.preventDefault();const c=el.dataset.cat;
      toolFilter={q:'',chip:c==='ocr'?'ocr':c==='image'?'image':['word','excel','ppt'].includes(c)?'office':'all'};go('tools')},
    'theme':()=>setTheme(state.theme==='dark'?'light':'dark'),
    'menu':()=>{$('#mobileMenu').classList.toggle('open')},
    'open-search':()=>{e.preventDefault();$('#mobileMenu').classList.remove('open');
      if(state.view==='tools')$('#toolSearch')?.focus();else{go('tools');setTimeout(()=>$('#toolSearch')?.focus(),60)}},
    'shortcuts':()=>openShortcuts(),
    'login':()=>{e.preventDefault();$('#mobileMenu').classList.remove('open');openAuth()},
    'logout':()=>{e.preventDefault();state.user=null;LS.set('user',null);toast('info','Signed out');rerender()},
    'chip':()=>{toolFilter.chip=el.dataset.chip;renderToolGrid();
      $$('.chip[data-chip]').forEach(c=>c.classList.toggle('on',c.dataset.chip===toolFilter.chip))},
    'fav':ev=>{e.stopPropagation();e.preventDefault();const id=el.dataset.id;
      const i=state.favorites.indexOf(id);
      if(i>=0){state.favorites.splice(i,1);toast('info','Removed from favorites')}
      else{state.favorites.push(id);toast('success','Added to favorites',byId[id]?.name||'')}
      LS.set('favs',state.favorites);
      el.classList.toggle('on');el.setAttribute('aria-pressed',el.classList.contains('on'));
      if(state.view==='tools')renderToolGrid();
      if(state.view==='dash'&&state.dashTab==='favs')rerender()},
    'open-tool':()=>{if(e.target.closest('[data-action=fav]'))return;go('tool',el.dataset.id)},
    'smart-tool':()=>{closeModal();go('tool',el.dataset.id,window._smartFiles||[])},
    'ws-browse':()=>{},
    'ws-add':()=>pickFiles(ws.tool),
    'sig-open':()=>openSignaturePad(),
    'f-remove':()=>{const i=+el.dataset.idx;const f=ws.files[i];if(f&&f.pages)ws.totalPages=Math.max(0,(ws.totalPages||0)-f.pages);
      ws.files.splice(i,1);if(!ws.files.length)ws.stage='upload';renderWs()},
    'mv':()=>{const i=+el.dataset.idx,d=+el.dataset.dir,j=i+d;
      if(j<0||j>=ws.files.length)return;[ws.files[i],ws.files[j]]=[ws.files[j],ws.files[i]];renderWs()},
    'convert':()=>processTool(),
    'dl':()=>{const b=blobs.get(el.dataset.id);
      if(b)download(b.blob,b.name);
      else toast('warning','Session expired','File buffers live only in this session — run the tool again.')},
    'dl-all':async()=>{if(!ws||!ws.outputs||!ws.outputs.length)return;
      try{await loadLib('jszip');const z=new JSZip();
        ws.outputs.forEach(o=>z.file(o.name,o.blob));
        download(await z.generateAsync({type:'blob'}),'manikutty-results.zip');
        toast('success','ZIP downloaded','All files packed — free, of course.')}
      catch(err){toast('error','ZIP failed','Could not build the archive.')}},
    'share':async()=>{if(navigator.share){try{await navigator.share({title:'ManiKutty',text:'I just converted files with ManiKutty — locally and 100% free.'})}catch(_){}}
      else toast('info','Sharing','Use “Copy link” to share ManiKutty with someone.')},
    'copy-link':()=>{navigator.clipboard?.writeText(location.href).then(()=>toast('success','Link copied','Send it to anyone — ManiKutty is free for them too.'))
      .catch(()=>toast('warning','Copy failed','Clipboard unavailable in this context.'))},
    'preview':()=>openPreview(el.dataset.id),
    'again':()=>{ws.outputs.forEach(o=>URL.revokeObjectURL(o.url));ws.outputs=[];ws.stage='config';renderWs()},
    'new-task':()=>go('tool',ws.tool.id),
    'dash-tab':()=>{state.dashTab=el.dataset.tab;viewDash()},
    'clear-data':()=>{['favs','recentTools','history','trash','user','theme'].forEach(k=>localStorage.removeItem('mk_'+k));
      toast('success','Local data cleared');setTimeout(()=>location.reload(),600)},
    'trash-move':()=>{const i=state.history.findIndex(x=>x.id===el.dataset.id);
      if(i>=0){state.trash.unshift(state.history[i]);state.history.splice(i,1);
        LS.set('history',state.history);LS.set('trash',state.trash);viewDash();toast('info','Moved to trash')}},
    'restore':()=>{const i=state.trash.findIndex(x=>x.id===el.dataset.id);
      if(i>=0){state.history.unshift(state.trash[i]);state.trash.splice(i,1);
        LS.set('history',state.history);LS.set('trash',state.trash);viewDash();toast('success','Restored')}},
    'again-tool':()=>go('tool',el.dataset.id),
    'hero-upload':()=>pickAny(),
  };
  const fn=acts[a];fn&&fn(el,e);
});
document.addEventListener('keydown',e=>{
  const typing=/input|textarea|select/i.test(e.target.tagName);
  if(e.key==='Enter'&&e.target.classList?.contains('tcard'))e.target.click();
  if(e.key==='Enter'&&e.target.getAttribute?.('role')==='button'&&e.target.dataset?.action==='preview')e.target.click();
  if(e.key==='Escape'){closeModal();$('#mobileMenu')?.classList.remove('open')}
  if(e.key==='?'&&!typing){e.preventDefault();openShortcuts()}
  if(e.key==='/'&&!typing){e.preventDefault();if(state.view==='tools')$('#toolSearch')?.focus();else go('tools')}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setTheme(state.theme==='dark'?'light':'dark')}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();
    if(ws&&ws.outputs&&ws.outputs.length){const o=ws.outputs[0];download(o.blob,o.name);toast('success','Saved',o.name)}}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){e.preventDefault();ws?pickFiles(ws.tool):pickAny()}
});
/* ---------- Smart drop (anywhere on the page) ---------- */
let dragDepth=0;
window.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragDepth++;$('#dropOverlay').classList.add('on')}});
window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#dropOverlay').classList.remove('on')});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{
  e.preventDefault();dragDepth=0;$('#dropOverlay').classList.remove('on');
  const fs=[...(e.dataTransfer?.files||[])];if(!fs.length)return;
  smartHandleFiles(fs);
});
/* close mobile menu on any nav tap inside it */
document.addEventListener('click',e=>{if(e.target.closest('#mobileMenu a,#mobileMenu .mlink'))$('#mobileMenu').classList.remove('open')});
/* ---------- Router ---------- */
function rerender(){
  if(state.view==='home')viewHome();
  else if(state.view==='tools')viewTools();
  else if(state.view==='dash')viewDash();
  else if(state.view==='tool'&&state.toolId)viewTool(state.toolId);
}
function go(view,param,presetFiles){
  closeModal();$('#mobileMenu')?.classList.remove('open');
  state.view=view;state.toolId=param;
  window.scrollTo({top:0});
  if(view==='home')viewHome();
  else if(view==='tools')viewTools();
  else if(view==='dash')viewDash();
  else if(view==='tool')viewTool(param,presetFiles);
}
/* ---------- Boot ---------- */
setTheme(state.theme);
go('home');
toast('info','Welcome to ManiKutty','All '+TOOLS.length+' tools are unlocked and free. Press / to search, or drop any file anywhere.');
</script>
